# services/ocr-service is partner-owned and intentionally not covered here.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.java.outputs.changes }}
      node: ${{ steps.node.outputs.changes }}
      web: ${{ steps.apps.outputs.web }}
      mobile: ${{ steps.apps.outputs.mobile }}
      admin: ${{ steps.apps.outputs.admin }}
    steps:
      - uses: actions/checkout@v7
      - id: java
        uses: dorny/paths-filter@v4
        with:
          filters: |
            identity-service:
              - &shared ['packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci.yml']
              - 'services/identity-service/**'
              - 'services/notification-service/**'
              - 'services/workspace-service/test/**'
            workspace-service:
              - *shared
              - 'services/workspace-service/**'
              - 'services/notification-service/**'
              - 'services/workspace-service/test/**'
            workflow-service:
              - *shared
              - 'services/workflow-service/**'
              - 'services/notification-service/**'
              - 'services/workspace-service/test/**'
      - id: node
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api-gateway:
              - &shared ['packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci.yml']
              - 'services/api-gateway/**'
            ai-service:
              - *shared
              - 'services/ai-service/**'
            notification-service:
              - *shared
              - 'services/notification-service/**'
      - id: apps
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - &shared ['packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci.yml']
              - 'apps/web/**'
            mobile:
              - *shared
              - 'apps/mobile/**'
            admin:
              - *shared
              - 'apps/admin/**'

  java:
    name: java (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.java != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./services/notification-service
      - run: pnpm --dir services/notification-service build
      - name: Maven verify
        working-directory: services/${{ matrix.service }}
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
          # CI-only test exclusions (local runs unchanged). Remove an entry once its cause is fixed.
          #  identity-service: Avatar* tests need minio/minio, which Docker Hub no longer serves.
          #  workflow-service: HttpTransportIntegrationTest's TLS .pem fixtures are gitignored, so absent in CI.
          MAVEN_EXCLUDES: ${{ matrix.service == 'identity-service' && '-Dtest=!AvatarTransactionRollbackIntegrationTest,!S3AvatarStorageIntegrationTest,!AvatarHttpIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false' || matrix.service == 'workflow-service' && '-Dtest=!HttpTransportIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false' || '' }}
        run: |
          # shellcheck disable=SC2086 # MAVEN_EXCLUDES holds several flags; word splitting is intended
          ./mvnw -B verify $MAVEN_EXCLUDES

  node:
    name: node (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.node) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./services/${{ matrix.service }}
      # Build before lint and tests: the ai/notification builds run `prisma generate`; type-aware lint and the tests
      # need the generated client (without it every Prisma call reads as an unresolved type).
      - name: Build
        working-directory: services/${{ matrix.service }}
        run: pnpm build
      # Read-only lint (pnpm lint runs --fix). Blocking: all three services were brought to 0 problems on 2026-10-12.
      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: pnpm exec eslint "{src,test}/**/*.ts"
      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        run: pnpm test
      - name: E2E tests
        working-directory: services/${{ matrix.service }}
        run: pnpm test:e2e

  notification-integration:
    needs: changes
    # runtime.integration.cjs also loads api-gateway's built notifications module.
    if: contains(fromJSON(needs.changes.outputs.node), 'notification-service') || contains(fromJSON(needs.changes.outputs.node), 'api-gateway')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ports and settings mirror services/notification-service/test/compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notification_test
          POSTGRES_DB: notification_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U notification_test -d notification_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 15689:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./services/notification-service --filter ./services/api-gateway
      # Integration tests require ../dist and ../../api-gateway/dist.
      - run: pnpm --dir services/notification-service build
      - run: pnpm --dir services/api-gateway build
      - run: pnpm --dir services/notification-service test:integration
      - run: pnpm --dir services/notification-service test:inbox-integration

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./apps/web
      - run: pnpm --dir apps/web exec tsc --noEmit
      # Playwright suite intentionally excluded (known red on dev: stale assertions).
      - run: pnpm --dir apps/web build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./apps/mobile
      - name: Typecheck
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit -p .

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./apps/admin
      - run: pnpm --dir apps/admin exec tsc --noEmit -p tsconfig.app.json
      - run: pnpm --dir apps/admin exec eslint .
      # Playwright suite intentionally excluded (mirrors web).
      - run: pnpm --dir apps/admin build

  # Single required status check. Skipped jobs count as success so path-filtered PRs can still merge.
  ci-ok:
    name: ci-ok
    needs: [changes, java, node, notification-integration, web, mobile, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Continuous deployment: on main, once every check passed, build the demo images and push them to GHCR.
  # The VM pulls them (infrastructure/deploy/weav-deploy.timer); nothing here can reach the VM.
  publish-images:
    needs: ci-ok
    # always(): without it GitHub adds success(), which is false when path-filtered jobs upstream of ci-ok were skipped.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: identity-service, context: services/identity-service, file: services/identity-service/Dockerfile }
          - { service: workspace-service, context: services/workspace-service, file: services/workspace-service/Dockerfile }
          - { service: workflow-service, context: services/workflow-service, file: services/workflow-service/Dockerfile, build-contexts: 'workflow-schema=packages/workflow-schema' }
          - { service: ai-service, context: ., file: services/ai-service/Dockerfile }
          - { service: api-gateway, context: ., file: services/api-gateway/Dockerfile }
          - { service: notification-service, context: ., file: services/notification-service/Dockerfile }
          - { service: ocr-service, context: services/ocr-service, file: services/ocr-service/Dockerfile.dev, build-args: 'OCR_RUNTIME=onnx' }
          - service: web
            context: .
            file: apps/web/Dockerfile
            build-args: |
              VITE_API_BASE_URL=https://api.weav.id.vn
              VITE_IDENTITY_SERVICE_URL=https://api.weav.id.vn
              VITE_API_MODE=http
              VITE_ANDROID_APK_URL=${{ vars.WEAV_ANDROID_APK_URL }}
          - service: admin
            context: .
            file: apps/admin/Dockerfile
            build-args: |
              VITE_API_GATEWAY_URL=https://api.weav.id.vn
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          # The VM checks out the commit in this label so its compose file matches the images.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/weav-${{ matrix.service }}:main
            ghcr.io/${{ github.repository_owner }}/weav-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
