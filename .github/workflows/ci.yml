# services/ocr-service is partner-owned and intentionally not covered here.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.java.outputs.changes }}
      node: ${{ steps.node.outputs.changes }}
      web: ${{ steps.apps.outputs.web }}
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - id: java
        uses: dorny/paths-filter@v4
        with:
          filters: |
            identity-service:
              - &shared ['packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci.yml']
              - 'services/identity-service/**'
              - 'services/notification-service/**'
              - 'services/workspace-service/test/**'
            workspace-service:
              - *shared
              - 'services/workspace-service/**'
              - 'services/notification-service/**'
              - 'services/workspace-service/test/**'
            workflow-service:
              - *shared
              - 'services/workflow-service/**'
              - 'services/notification-service/**'
              - 'services/workspace-service/test/**'
      - id: node
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api-gateway:
              - &shared ['packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci.yml']
              - 'services/api-gateway/**'
            ai-service:
              - *shared
              - 'services/ai-service/**'
            bot-service:
              - *shared
              - 'services/bot-service/**'
            notification-service:
              - *shared
              - 'services/notification-service/**'
      - id: apps
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - &shared ['packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci.yml']
              - 'apps/web/**'
            mobile:
              - *shared
              - 'apps/mobile/**'

  java:
    name: java (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.java != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./services/notification-service
      - run: pnpm --dir services/notification-service build
      - name: Maven verify
        working-directory: services/${{ matrix.service }}
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
          # CI-only test exclusions (local runs unchanged). Remove an entry once its cause is fixed.
          #  identity-service: Avatar* tests need minio/minio, which Docker Hub no longer serves.
          #  workflow-service: HttpTransportIntegrationTest's TLS .pem fixtures are gitignored, so absent in CI.
          MAVEN_EXCLUDES: ${{ matrix.service == 'identity-service' && '-Dtest=!AvatarTransactionRollbackIntegrationTest,!S3AvatarStorageIntegrationTest,!AvatarHttpIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false' || matrix.service == 'workflow-service' && '-Dtest=!HttpTransportIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false' || '' }}
        run: |
          # shellcheck disable=SC2086 # MAVEN_EXCLUDES holds several flags; word splitting is intended
          ./mvnw -B verify $MAVEN_EXCLUDES

  node:
    name: node (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.node) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./services/${{ matrix.service }}
      # Read-only lint (pnpm lint runs --fix). Non-blocking while dev has pre-existing errors: api-gateway 2, ai-service 140, notification-service 46 (2026-10-03). bot-service is clean, so it blocks.
      - name: Lint
        working-directory: services/${{ matrix.service }}
        continue-on-error: ${{ matrix.service != 'bot-service' }}
        run: pnpm exec eslint "{src,test}/**/*.ts"
      # Build before tests: notification-service's build runs `prisma generate`, which its tests need.
      - name: Build
        working-directory: services/${{ matrix.service }}
        run: pnpm build
      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        run: pnpm test
      - name: E2E tests
        working-directory: services/${{ matrix.service }}
        run: pnpm test:e2e

  notification-integration:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.node), 'notification-service')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ports and settings mirror services/notification-service/test/compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notification_test
          POSTGRES_DB: notification_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U notification_test -d notification_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 15689:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./services/notification-service
      # Integration tests require ../dist.
      - run: pnpm --dir services/notification-service build
      - run: pnpm --dir services/notification-service test:integration
      - run: pnpm --dir services/notification-service test:inbox-integration

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./apps/web
      - run: pnpm --dir apps/web exec tsc --noEmit
      # Playwright suite intentionally excluded (known red on dev: stale assertions).
      - run: pnpm --dir apps/web build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter ./apps/mobile
      - name: Typecheck
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit -p .

  # Single required status check. Skipped jobs count as success so path-filtered PRs can still merge.
  ci-ok:
    name: ci-ok
    needs: [changes, java, node, notification-integration, web, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
