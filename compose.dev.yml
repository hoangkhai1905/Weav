services:
  identity-service:
    profiles: ["app"]
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    env_file:
      - .env

    develop:
      watch:
        - action: sync+exec
          path: ./services/identity-service/src
          target: /app/src
          initial_sync: true
          exec:
            command: ./mvnw -q -DskipTests compile

        - action: rebuild
          path: ./services/identity-service/pom.xml

  workflow-service:
    profiles: ["app"]
    build:
      context: ./services/workflow-service
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8080"
    env_file:
      - .env

    develop:
      watch:
        - action: sync+exec
          path: ./services/workflow-service/src
          target: /app/src
          initial_sync: true
          exec:
            command: ./mvnw -q -DskipTests compile

        - action: rebuild
          path: ./services/workflow-service/pom.xml
          
  ai-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile.dev
    ports:
      - "3001:3000"
    env_file:
      - .env

  api-gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
    - .env

  bot-notification-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/bot-notification-service/Dockerfile.dev
    env_file:
      - .env

  ocr-service:
    profiles: ["app"]
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env