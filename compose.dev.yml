services:
  # ==================================================
  # Identity Service - Spring Boot
  # ==================================================
  identity-service:
    profiles: ["app"]

    build:
      context: ./services/identity-service
      dockerfile: Dockerfile.dev

    ports:
      - "8081:8080"

    environment:
      APP_ENV: ${APP_ENV:-development}

      DB_HOST: ${IDENTITY_DB_HOST}
      DB_PORT: ${IDENTITY_DB_PORT:-5432}
      DB_NAME: ${IDENTITY_DB_NAME}
      DB_USERNAME: ${IDENTITY_DB_USERNAME}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      DB_SSL_MODE: ${IDENTITY_DB_SSL_MODE:-require}
      DB_SCHEMA: identity

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # Optional Google OAuth. Compose interpolation forwards root .env values
      # into the container; blank credentials keep the provider disabled.
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/auth/oauth/google/callback}
      OAUTH_WEB_RETURN_TARGET_URI: ${OAUTH_WEB_RETURN_TARGET_URI:-http://localhost:5173/auth/callback}
      OAUTH_WEB_ALLOWED_ORIGIN: ${OAUTH_WEB_ALLOWED_ORIGIN:-http://localhost:5173}

      # Valkey OTP state
      VALKEY_URL: ${VALKEY_URL}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}

      # SMTP authentication mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_AUTH_ENABLED: ${SMTP_AUTH_ENABLED:-false}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-false}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}

      # S3-compatible avatar storage (R2/MinIO); values stay in the root environment.
      AVATAR_S3_ENDPOINT: ${AVATAR_S3_ENDPOINT:-}
      AVATAR_S3_REGION: ${AVATAR_S3_REGION:-auto}
      AVATAR_S3_BUCKET: ${AVATAR_S3_BUCKET:-}
      AVATAR_S3_ACCESS_KEY_ID: ${AVATAR_S3_ACCESS_KEY_ID:-}
      AVATAR_S3_SECRET_ACCESS_KEY: ${AVATAR_S3_SECRET_ACCESS_KEY:-}
      AVATAR_S3_PATH_STYLE_ACCESS: ${AVATAR_S3_PATH_STYLE_ACCESS:-true}
      AVATAR_S3_KEY_PREFIX: ${AVATAR_S3_KEY_PREFIX:-avatars}
      AVATAR_S3_SIGNED_URL_TTL: ${AVATAR_S3_SIGNED_URL_TTL:-5m}
      AVATAR_S3_CLEANUP_QUEUE_CAPACITY: ${AVATAR_S3_CLEANUP_QUEUE_CAPACITY:-1000}
      AVATAR_S3_CLEANUP_INTERVAL_MS: ${AVATAR_S3_CLEANUP_INTERVAL_MS:-30000}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    develop:
      watch:
        - action: sync+exec
          path: ./services/identity-service/src
          target: /app/src
          initial_sync: true
          exec:
            command: ./mvnw -q -DskipTests compile

        - action: rebuild
          path: ./services/identity-service/pom.xml

    # ==================================================
  # Workspace Service - Spring Boot
  # ==================================================
  workspace-service:
    profiles: ["app"]

    build:
      context: ./services/workspace-service
      dockerfile: Dockerfile.dev

    ports:
      - "8082:8080"

    environment:
      APP_ENV: ${APP_ENV:-development}

      DB_HOST: ${WORKSPACE_DB_HOST}
      DB_PORT: ${WORKSPACE_DB_PORT:-5432}
      DB_NAME: ${WORKSPACE_DB_NAME}
      DB_USERNAME: ${WORKSPACE_DB_USERNAME}
      DB_PASSWORD: ${WORKSPACE_DB_PASSWORD}
      DB_SSL_MODE: ${WORKSPACE_DB_SSL_MODE:-require}
      DB_SCHEMA: workspace

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

    develop:
      watch:
        - action: sync+exec
          path: ./services/workspace-service/src
          target: /app/src
          initial_sync: true
          exec:
            command: ./mvnw -q -DskipTests compile

        - action: rebuild
          path: ./services/workspace-service/pom.xml


  # ==================================================
  # Workflow Service - Spring Boot
  # ==================================================
  workflow-service:
    profiles: ["app"]

    build:
      context: ./services/workflow-service
      dockerfile: Dockerfile.dev

    ports:
      - "8083:8080"

    environment:
      APP_ENV: ${APP_ENV:-development}

      # Neon PostgreSQL pooled connection
      DB_HOST: ${WORKFLOW_DB_HOST}
      DB_PORT: ${WORKFLOW_DB_PORT:-5432}
      DB_NAME: ${WORKFLOW_DB_NAME}
      DB_USERNAME: ${WORKFLOW_DB_USERNAME}
      DB_PASSWORD: ${WORKFLOW_DB_PASSWORD}
      DB_SSL_MODE: ${WORKFLOW_DB_SSL_MODE:-require}
      DB_SCHEMA: workflow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # Valkey
      VALKEY_URL: ${VALKEY_URL}

      # RabbitMQ
      # Inside Docker network, use service name instead of localhost.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

    depends_on:
      rabbitmq:
        condition: service_healthy

    develop:
      watch:
        - action: sync+exec
          path: ./services/workflow-service/src
          target: /app/src
          initial_sync: true
          exec:
            command: ./mvnw -q -DskipTests compile

        - action: rebuild
          path: ./services/workflow-service/pom.xml


  # ==================================================
  # AI Service - NestJS
  # ==================================================
  ai-service:
    profiles: ["app"]

    build:
      context: .
      dockerfile: services/ai-service/Dockerfile.dev

    ports:
      - "3001:3000"

    environment:
      APP_ENV: ${APP_ENV:-development}

      # AI providers
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

    depends_on:
      rabbitmq:
        condition: service_healthy


  # ==================================================
  # API Gateway - NestJS
  # ==================================================
  api-gateway:
    profiles: ["app"]

    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile.dev

    ports:
      - "3000:3000"

    environment:
      APP_ENV: ${APP_ENV:-development}

      # Valkey - rate limiting / cache
      VALKEY_URL: ${VALKEY_URL}

      # Internal service URLs
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}
      WORKSPACE_SERVICE_URL: http://workspace-service:8080
      WORKFLOW_SERVICE_URL: http://workflow-service:8080
      AI_SERVICE_URL: http://ai-service:3000
      OCR_SERVICE_URL: http://ocr-service:8000
      BOT_SERVICE_URL: http://bot-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}


  # ==================================================
  # Bot - NestJS
  # ==================================================
  bot-service:
    profiles: ["app"]

    build:
      context: .
      dockerfile: services/bot-service/Dockerfile.dev

    environment:
      APP_ENV: ${APP_ENV:-development}

      # Neon PostgreSQL pooled connection
      DB_HOST: ${BOT_DB_HOST}
      DB_PORT: ${BOT_DB_PORT:-5432}
      DB_NAME: ${BOT_DB_NAME}
      DB_USERNAME: ${BOT_DB_USERNAME}
      DB_PASSWORD: ${BOT_DB_PASSWORD}
      DB_SSL_MODE: ${BOT_DB_SSL_MODE:-require}
      DB_SCHEMA: bot

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # Workflow Service
      WORKFLOW_SERVICE_URL: http://workflow-service:8080

    depends_on:
      rabbitmq:
        condition: service_healthy


  # ==================================================
  # Notification Service - NestJS
  # ==================================================
  notification-service:
    profiles: ["app"]

    build:
      context: .
      dockerfile: services/notification-service/Dockerfile.dev

    environment:
      APP_ENV: ${APP_ENV:-development}

      # Neon PostgreSQL pooled connection
      DB_HOST: ${NOTIFICATION_DB_HOST}
      DB_PORT: ${NOTIFICATION_DB_PORT:-5432}
      DB_NAME: ${NOTIFICATION_DB_NAME}
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      DB_SSL_MODE: ${NOTIFICATION_DB_SSL_MODE:-require}
      DB_SCHEMA: notification
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-weav-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-weav-api}
      NOTIFICATION_TELEGRAM_ENABLED: ${NOTIFICATION_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOTIFICATION_EXPO_ENABLED: ${NOTIFICATION_EXPO_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      NOTIFICATION_EXCHANGE: ${NOTIFICATION_EXCHANGE:-weav.events}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-service.execution-events}
      NOTIFICATION_DLQ: ${NOTIFICATION_DLQ:-notification-service.execution-events.dlq}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_RETRY_BASE_MS: ${NOTIFICATION_RETRY_BASE_MS:-1000}
      NOTIFICATION_RETRY_MAX_MS: ${NOTIFICATION_RETRY_MAX_MS:-300000}
      NOTIFICATION_TIMEOUT_MS: ${NOTIFICATION_TIMEOUT_MS:-10000}
      NOTIFICATION_LEASE_MS: ${NOTIFICATION_LEASE_MS:-60000}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-1000}
      NOTIFICATION_DETAIL_BASE_URL: ${NOTIFICATION_DETAIL_BASE_URL:-}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

    depends_on:
      rabbitmq:
        condition: service_healthy


  # ==================================================
  # OCR Service - Python
  # ==================================================
  ocr-service:
    profiles: ["app"]

    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile.dev

    ports:
      - "8000:8000"

    environment:
      APP_ENV: ${APP_ENV:-development}
      OCR_MODEL_ROOT: /models
      WEAV_OCR_MODEL_MANIFEST: /app/config/model-manifest.json

    volumes:
      - type: bind
        source: ${OCR_MODEL_HOST_PATH:-./.data/ocr-models}
        target: /models
        read_only: true
