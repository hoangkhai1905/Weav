spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=workspace
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

weav.identity.base-url=http://localhost:8081
weav.identity.connect-timeout=3s
weav.identity.read-timeout=5s
weav.workspace.authorization-cache.ttl=PT5M
spring.data.redis.url=redis://localhost:6379

spring.flyway.enabled=true
spring.flyway.schemas=workspace
spring.flyway.default-schema=workspace
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

weav.jwt.access-secret=test-access-secret
weav.jwt.refresh-secret=test-refresh-secret
weav.jwt.access-expires-in=15m
weav.jwt.refresh-expires-in=7d
