spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=workspace
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

weav.identity.base-url=http://localhost:8081
weav.identity.connect-timeout=3s
weav.identity.read-timeout=5s
weav.identity.internal-service-key=test-directory-key
weav.internal.service-key=test-workspace-key
weav.workspace.authorization-cache.ttl=PT5M
spring.data.redis.url=redis://localhost:6379
weav.workflow.base-url=http://127.0.0.1:1
weav.workflow.connect-timeout=500ms
weav.workflow.read-timeout=500ms
weav.workflow.internal-service-key=test-workflow-key

spring.flyway.enabled=true
spring.flyway.schemas=workspace
spring.flyway.default-schema=workspace
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

weav.jwt.access-secret=weav-test-access-secret-0123456789abcdef
weav.jwt.refresh-secret=weav-test-refresh-secret-0123456789abcdef
weav.jwt.issuer=weav-identity
weav.jwt.audience=weav-api
weav.jwt.clock-skew=30s
weav.jwt.access-expires-in=15m
weav.jwt.refresh-expires-in=7d

# Synthetic test-only AES-256 key: Base64 for 32 deterministic bytes.
weav.credential.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
weav.credential.encryption-key-version=v1

# Synthetic OAuth client values only; provider calls use local fixtures.
weav.google.oauth.client-id=test-google-client.apps.googleusercontent.com
weav.google.oauth.client-secret=test-google-client-secret
weav.google.oauth.redirect-uri=http://localhost:8080/oauth/google/callback
weav.google.oauth.frontend-return-url=http://localhost:3000/connections
weav.google.oauth.state-ttl=PT10M
