# ==================================================
# Application
# ==================================================

spring.application.name=workspace-service
server.port=8080

# ==================================================
# Actuator health checks
# ==================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db


# ==================================================
# Neon PostgreSQL pooled connection
# ==================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.credential.encryption.key=${CREDENTIAL_ENCRYPTION_KEY}


# ==================================================
# JPA / Hibernate
# ==================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:workspace}

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# ==================================================
# Cross-service and authorization foundation
# ==================================================

weav.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
weav.identity.connect-timeout=${IDENTITY_CONNECT_TIMEOUT:3s}
weav.identity.read-timeout=${IDENTITY_READ_TIMEOUT:5s}
weav.workspace.authorization-cache.ttl=${WORKSPACE_AUTHORIZATION_CACHE_TTL:PT5M}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}


# ==================================================
# Flyway
# ==================================================

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:workspace}
spring.flyway.default-schema=${DB_SCHEMA:workspace}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# ==================================================
# JWT skeleton
# ==================================================

weav.jwt.access-secret=${JWT_ACCESS_SECRET}
weav.jwt.refresh-secret=${JWT_REFRESH_SECRET}
weav.jwt.access-expires-in=${JWT_ACCESS_EXPIRES_IN:15m}
weav.jwt.refresh-expires-in=${JWT_REFRESH_EXPIRES_IN:7d}

# ==================================================
# HikariCP
# ==================================================
# Đang limit số lượng kết nối tối đa để tránh quá tải cơ sở dữ liệu là 3, sau này có thêm database thì sẽ tăng lên

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
