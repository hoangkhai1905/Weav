# ==================================================
# Application
# ==================================================

spring.application.name=workspace-service
server.port=8080

# ==================================================
# Actuator health checks
# ==================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ==================================================
# Google OAuth connection authorization
# ==================================================

weav.google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
weav.google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
weav.google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/oauth/google/callback}
weav.google.oauth.frontend-return-url=${GOOGLE_OAUTH_FRONTEND_RETURN_URL:http://localhost:3000/connections}
weav.google.oauth.state-ttl=${GOOGLE_OAUTH_STATE_TTL:PT10M}
# Lifetime of the parked callback code before the signed-in user completes the connection (max PT10M).
weav.google.oauth.completion-ttl=${GOOGLE_OAUTH_COMPLETION_TTL:PT5M}


# ==================================================
# Neon PostgreSQL pooled connection
# ==================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
weav.credential.encryption-key=${CREDENTIAL_ENCRYPTION_KEY}
weav.credential.encryption-key-version=${CREDENTIAL_ENCRYPTION_KEY_VERSION:v1}
weav.credential.previous-keys=${CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:}


# ==================================================
# JPA / Hibernate
# ==================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:workspace}

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# ==================================================
# Cross-service and authorization foundation
# ==================================================

weav.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
weav.identity.connect-timeout=${IDENTITY_CONNECT_TIMEOUT:3s}
weav.identity.read-timeout=${IDENTITY_READ_TIMEOUT:5s}
weav.identity.internal-service-key=${IDENTITY_INTERNAL_SERVICE_KEY:}
weav.internal.service-key=${WEAV_INTERNAL_SERVICE_KEY:}
weav.internal.service-jwks-file=${WORKSPACE_SERVICE_JWKS_FILE:}
weav.internal.require-service-jwt=${WORKSPACE_INTERNAL_REQUIRE_SERVICE_JWT:false}
weav.workspace.authorization-cache.ttl=${WORKSPACE_AUTHORIZATION_CACHE_TTL:PT5M}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_TLS_ENABLED:${RABBITMQ_SSL_ENABLED:false}}
spring.rabbitmq.connection-timeout=${WORKSPACE_RABBITMQ_CONNECTION_TIMEOUT:3s}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
weav.workspace.notification-outbox.publisher-enabled=${WORKSPACE_NOTIFICATION_PUBLISHER_ENABLED:true}
weav.workspace.notification-outbox.batch-size=${WORKSPACE_NOTIFICATION_OUTBOX_BATCH_SIZE:25}
weav.workspace.notification-outbox.poll-interval=${WORKSPACE_NOTIFICATION_OUTBOX_POLL_INTERVAL:1000}
weav.workspace.notification-outbox.initial-delay=${WORKSPACE_NOTIFICATION_OUTBOX_INITIAL_DELAY:1000}
weav.workspace.notification-outbox.confirm-timeout=${WORKSPACE_NOTIFICATION_OUTBOX_CONFIRM_TIMEOUT:PT5S}
weav.workspace.notification-outbox.max-retry-delay=${WORKSPACE_NOTIFICATION_OUTBOX_MAX_RETRY_DELAY:PT60S}
weav.workspace.notification-outbox.max-attempts=${WORKSPACE_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:10}
weav.workspace.retention.outbox-days=${WORKSPACE_RETENTION_OUTBOX_DAYS:14}
weav.workspace.retention.idempotency-days=${WORKSPACE_RETENTION_IDEMPOTENCY_DAYS:7}
weav.workflow.base-url=${WORKFLOW_SERVICE_URL:http://localhost:8082}
weav.workflow.connect-timeout=${WORKFLOW_CONNECT_TIMEOUT:3s}
weav.workflow.read-timeout=${WORKFLOW_READ_TIMEOUT:5s}
weav.workflow.internal-service-key=${WORKFLOW_INTERNAL_SERVICE_KEY:}


# ==================================================
# Flyway
# ==================================================

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:workspace}
spring.flyway.default-schema=${DB_SCHEMA:workspace}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# ==================================================
# JWT skeleton
# ==================================================

weav.jwt.access-secret=${JWT_ACCESS_SECRET}
weav.jwt.issuer=${JWT_ISSUER:weav-identity}
weav.jwt.audience=${JWT_AUDIENCE:weav-api}
weav.jwt.clock-skew=${JWT_CLOCK_SKEW:30s}
weav.jwt.access-expires-in=${JWT_ACCESS_EXPIRES_IN:15m}
weav.jwt.refresh-expires-in=${JWT_REFRESH_EXPIRES_IN:7d}

# ==================================================
# HikariCP
# ==================================================
# Đang limit số lượng kết nối tối đa để tránh quá tải cơ sở dữ liệu là 3, sau này có thêm database thì sẽ tăng lên

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
