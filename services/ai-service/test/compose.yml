services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ai_test
      POSTGRES_DB: ai_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_test -d ai_test"]
      interval: 2s
      retries: 30
