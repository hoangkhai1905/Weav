services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notification_test
      POSTGRES_DB: notification_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:15439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_test -d notification_test"]
      interval: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-alpine
    ports: ["127.0.0.1:15689:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 30
