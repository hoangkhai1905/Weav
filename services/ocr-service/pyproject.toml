[project]
name = "ocr-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.141.1",
    "opencv-python-headless>=5.0.0.93",
    "paddleocr>=3.7.0",
    "paddlepaddle==3.3.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.uv.sources]
paddlepaddle = { index = "paddle" }

[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true