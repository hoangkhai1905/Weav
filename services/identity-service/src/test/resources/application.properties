weav.jwt.access-secret=weav-test-access-secret-0123456789abcdef
weav.jwt.refresh-secret=weav-test-refresh-secret-0123456789abcdef
weav.jwt.issuer=weav-identity
weav.jwt.audience=weav-api
weav.jwt.access-expires-in=15m
weav.jwt.refresh-expires-in=7d
weav.jwt.clock-skew=30s
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=identity
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
