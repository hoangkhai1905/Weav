# ==================================================
# Application
# ==================================================

spring.application.name=identity-service
server.port=8080

# ==================================================
# Actuator health checks
# ==================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db


# ==================================================
# Neon PostgreSQL pooled connection
# ==================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==================================================
# JPA / Hibernate
# ==================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:identity}

spring.jpa.open-in-view=false

# Useful while developing. Can disable later.
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# ==================================================
# Valkey OTP state
# ==================================================

spring.data.redis.url=${VALKEY_URL:redis://localhost:6379}
weav.otp.hmac-secret=${OTP_HMAC_SECRET:}

# ==================================================
# Optional Google OAuth web transport (M3 D2)
# ==================================================
# Blank GOOGLE_OAUTH_ENABLED auto-enables only when a Google client ID or secret
# is present; false forces the optional provider and routes off, while true
# requires the complete validated configuration.
weav.oauth.enabled=${GOOGLE_OAUTH_ENABLED:}
weav.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
weav.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
weav.oauth.google.issuer-uri=https://accounts.google.com
weav.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/auth/oauth/google/callback}
weav.oauth.web.return-target-uri=${OAUTH_WEB_RETURN_TARGET_URI:http://localhost:5173/auth/callback}
weav.oauth.web.allowed-origins[0]=${OAUTH_WEB_ALLOWED_ORIGIN:http://localhost:5173}
# Optional bounded policy overrides (defaults: 10m, 60s, 10m, 5s, 5 failures):
# weav.oauth.state-ttl=10m
# weav.oauth.handoff-ttl=60s
# weav.oauth.csrf-ttl=10m
# weav.oauth.provider-timeout=5s
# weav.oauth.max-handoff-proof-failures=5
# OAuth unlink admission is fixed at 5 / 15m / authenticated session and 10 / 15m / remote IP.

# ==================================================
# Authentication mail
# ==================================================

weav.mail.host=${SMTP_HOST:}
weav.mail.port=${SMTP_PORT:25}
weav.mail.username=${SMTP_USERNAME:}
weav.mail.password=${SMTP_PASSWORD:}
weav.mail.from=${SMTP_FROM_ADDRESS:}
weav.mail.auth=${SMTP_AUTH_ENABLED:false}
weav.mail.start-tls=${SMTP_STARTTLS_ENABLED:false}
weav.mail.start-tls-required=${SMTP_STARTTLS_REQUIRED:false}
weav.mail.ssl=${SMTP_SSL_ENABLED:false}
weav.mail.connection-timeout=${SMTP_CONNECTION_TIMEOUT:3s}
weav.mail.read-timeout=${SMTP_READ_TIMEOUT:5s}
weav.mail.write-timeout=${SMTP_WRITE_TIMEOUT:5s}
weav.mail.queue-capacity=${SMTP_QUEUE_CAPACITY:100}
weav.mail.core-pool-size=${SMTP_CORE_POOL_SIZE:1}
weav.mail.max-pool-size=${SMTP_MAX_POOL_SIZE:2}

# ==================================================
# S3-compatible avatar storage (R2/MinIO)
# ==================================================

weav.avatar.storage.endpoint=${AVATAR_S3_ENDPOINT:}
weav.avatar.storage.region=${AVATAR_S3_REGION:auto}
weav.avatar.storage.bucket=${AVATAR_S3_BUCKET:}
weav.avatar.storage.access-key=${AVATAR_S3_ACCESS_KEY_ID:}
weav.avatar.storage.secret-key=${AVATAR_S3_SECRET_ACCESS_KEY:}
weav.avatar.storage.path-style-access=${AVATAR_S3_PATH_STYLE_ACCESS:true}
weav.avatar.storage.key-prefix=${AVATAR_S3_KEY_PREFIX:avatars}
weav.avatar.storage.signed-url-ttl=${AVATAR_S3_SIGNED_URL_TTL:5m}
weav.avatar.storage.cleanup-queue-capacity=${AVATAR_S3_CLEANUP_QUEUE_CAPACITY:1000}
weav.avatar.storage.cleanup-interval-ms=${AVATAR_S3_CLEANUP_INTERVAL_MS:30000}


# ==================================================
# Flyway
# ==================================================

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:identity}
spring.flyway.default-schema=${DB_SCHEMA:identity}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration


# ==================================================
# JWT
# ==================================================

weav.jwt.access-secret=${JWT_ACCESS_SECRET}
weav.jwt.refresh-secret=${JWT_REFRESH_SECRET}
weav.jwt.issuer=${JWT_ISSUER:weav-identity}
weav.jwt.audience=${JWT_AUDIENCE:weav-api}
weav.jwt.access-expires-in=${JWT_ACCESS_EXPIRES_IN:15m}
weav.jwt.refresh-expires-in=${JWT_REFRESH_EXPIRES_IN:7d}
weav.jwt.clock-skew=${JWT_CLOCK_SKEW:30s}

# ==================================================
# HikariCP
# ==================================================
# Đang limit số lượng kết nối tối đa để tránh quá tải cơ sở dữ liệu là 3, sau này có thêm database thì sẽ tăng lên

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
