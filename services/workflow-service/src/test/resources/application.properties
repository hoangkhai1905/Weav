spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=workflow
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=workflow
spring.flyway.default-schema=workflow
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.health.rabbit.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

weav.jwt.access-secret=workflow-test-access-secret-with-at-least-32-utf8-bytes
weav.jwt.issuer=weav-identity
weav.jwt.audience=weav-api
weav.jwt.clock-skew=30s

weav.internal.service-key=workflow-test-internal-service-key
weav.workspace.base-url=http://localhost:8082
weav.workspace.connect-timeout=1s
weav.workspace.read-timeout=1s
weav.workspace.internal-service-key=workspace-test-internal-service-key
weav.workflow.execution-outbox.initial-delay=3600000
weav.workflow.execution-outbox.poll-interval=3600000
weav.workflow.notification-outbox.publisher-enabled=false
weav.workflow.notification-outbox.poll-interval=3600000
weav.workflow.notification-outbox.initial-delay=3600000
weav.workflow.schedule.scanner.enabled=false
weav.workflow.execution.worker.enabled=false
weav.workflow.execution.max-concurrent-nodes=2
weav.workflow.execution.executor-threads=4
weav.workflow.execution.executor-queue-size=16
weav.workflow.execution.timer-threads=2
weav.workflow.http.executor.enabled=false
weav.workflow.ocr.enabled=false
weav.workflow.ocr.url-source-enabled=false
weav.workflow.ocr.artifact-source-enabled=false
weav.workflow.ocr.service-claims-verified=false
weav.workflow.ocr.url-allowlist-verified=false
weav.workflow.ocr.artifact-resolver-verified=false
weav.workflow.ocr.base-url=http://localhost:8000
weav.workflow.ocr.key-id=
weav.workflow.ocr.private-key-location=
weav.workflow.ocr.connect-timeout=1s
weav.workflow.ocr.read-timeout=1s
weav.workflow.ocr.token-lifetime=60s
weav.workflow.ocr.max-response-bytes=1048576
weav.workflow.ai.enabled=false
weav.workflow.ai.generation-enabled=false
weav.workflow.ai.base-url=http://ai.internal
weav.workflow.ai.key-id=
weav.workflow.ai.private-key-location=
weav.workflow.ai.connect-timeout=1s
weav.workflow.ai.read-timeout=1s
weav.workflow.ai.token-lifetime=60s
weav.workflow.ai.max-response-bytes=1048576
weav.workflow.files.endpoint=
weav.workflow.files.bucket=
weav.workflow.files.access-key=
weav.workflow.files.secret-key=

# The alert watchdog is driven explicitly by the tests that exercise it.
weav.workflow.alerts.sweep.enabled=false
