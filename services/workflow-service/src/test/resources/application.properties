spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=workflow
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=workflow
spring.flyway.default-schema=workflow
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

weav.jwt.access-secret=test-access-secret
weav.jwt.refresh-secret=test-refresh-secret
weav.jwt.access-expires-in=15m
weav.jwt.refresh-expires-in=7d