# ==================================================
# Application
# ==================================================

spring.application.name=workflow-service
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.health.rabbit.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,rabbit


# ==================================================
# Neon PostgreSQL pooled connection
# ==================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==================================================
# JPA / Hibernate
# ==================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:workflow}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==================================================
# Flyway
# ==================================================

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:workflow}
spring.flyway.default-schema=${DB_SCHEMA:workflow}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration


# ==================================================
# RabbitMQ
# ==================================================

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ==================================================
# Execution admission and durable outbox delivery
# ==================================================

weav.workflow.execution.input.max-bytes=${WORKFLOW_EXECUTION_INPUT_MAX_BYTES:1048576}
weav.workflow.execution.input.max-depth=${WORKFLOW_EXECUTION_INPUT_MAX_DEPTH:32}
weav.workflow.webhook.rate-limit.requests-per-window=${WORKFLOW_WEBHOOK_RATE_LIMIT_REQUESTS_PER_WINDOW:6000}
weav.workflow.webhook.rate-limit.window=${WORKFLOW_WEBHOOK_RATE_LIMIT_WINDOW:1m}
weav.workflow.execution-outbox.batch-size=${WORKFLOW_EXECUTION_OUTBOX_BATCH_SIZE:50}
weav.workflow.execution-outbox.poll-interval=${WORKFLOW_EXECUTION_OUTBOX_POLL_INTERVAL:1000}
weav.workflow.execution-outbox.initial-delay=${WORKFLOW_EXECUTION_OUTBOX_INITIAL_DELAY:1000}
weav.workflow.execution-outbox.lease-duration=${WORKFLOW_EXECUTION_OUTBOX_LEASE_DURATION:30s}
weav.workflow.execution-outbox.confirm-timeout=${WORKFLOW_EXECUTION_OUTBOX_CONFIRM_TIMEOUT:5s}
weav.workflow.execution-outbox.max-retry-delay=${WORKFLOW_EXECUTION_OUTBOX_MAX_RETRY_DELAY:60s}

# Durable six-field cron scanner. Each due registration is admitted transactionally.
weav.workflow.schedule.scanner.enabled=${WORKFLOW_SCHEDULE_SCANNER_ENABLED:true}
weav.workflow.schedule.scanner.batch-size=${WORKFLOW_SCHEDULE_SCANNER_BATCH_SIZE:100}
weav.workflow.schedule.scanner.poll-interval-ms=${WORKFLOW_SCHEDULE_SCANNER_POLL_INTERVAL_MS:1000}
weav.workflow.schedule.scanner.initial-delay-ms=${WORKFLOW_SCHEDULE_SCANNER_INITIAL_DELAY_MS:1000}
weav.workflow.schedule.failure-backoff-ms=${WORKFLOW_SCHEDULE_FAILURE_BACKOFF_MS:30000}

# Bounded outbound HTTP adapter. Request ingress remains capped at 1 MiB by the servlet filter.
weav.workflow.http.connect-timeout=${WORKFLOW_HTTP_CONNECT_TIMEOUT:5s}
weav.workflow.http.call-timeout=${WORKFLOW_HTTP_CALL_TIMEOUT:30s}
weav.workflow.http.max-request-bytes=${WORKFLOW_HTTP_MAX_REQUEST_BYTES:1048576}
weav.workflow.http.max-response-bytes=${WORKFLOW_HTTP_MAX_RESPONSE_BYTES:1048576}
weav.workflow.http.max-header-bytes=${WORKFLOW_HTTP_MAX_HEADER_BYTES:65536}

# ==================================================
# Execution worker, bounded runtime, and recovery
# ==================================================

# Disabled by default; enable only when a real NodeExecutor registry is wired.
weav.workflow.execution.worker.enabled=${WORKFLOW_EXECUTION_WORKER_ENABLED:false}
weav.workflow.execution.worker.owner=${WORKFLOW_EXECUTION_WORKER_OWNER:${HOSTNAME:workflow-worker}}
weav.workflow.execution.worker.lease-duration=${WORKFLOW_EXECUTION_WORKER_LEASE_DURATION:60s}
weav.workflow.execution.worker.heartbeat-interval=${WORKFLOW_EXECUTION_WORKER_HEARTBEAT_INTERVAL:15s}
weav.workflow.execution.worker.confirm-timeout=${WORKFLOW_EXECUTION_WORKER_CONFIRM_TIMEOUT:5s}
weav.workflow.execution.worker.transient-redelivery-delay=${WORKFLOW_EXECUTION_WORKER_REDELIVERY_DELAY:5000}
weav.workflow.execution.worker.max-transient-redeliveries=${WORKFLOW_EXECUTION_WORKER_MAX_REDELIVERIES:3}
weav.workflow.execution.max-concurrent-nodes=${WORKFLOW_EXECUTION_MAX_CONCURRENT_NODES:4}
weav.workflow.execution.executor-threads=${WORKFLOW_EXECUTION_EXECUTOR_THREADS:8}
weav.workflow.execution.executor-queue-size=${WORKFLOW_EXECUTION_EXECUTOR_QUEUE_SIZE:128}
weav.workflow.execution.timer-threads=${WORKFLOW_EXECUTION_TIMER_THREADS:2}
weav.workflow.execution.recovery.batch-size=${WORKFLOW_EXECUTION_RECOVERY_BATCH_SIZE:50}
weav.workflow.execution.recovery.poll-interval=${WORKFLOW_EXECUTION_RECOVERY_POLL_INTERVAL:30s}
weav.workflow.execution.recovery.initial-delay=${WORKFLOW_EXECUTION_RECOVERY_INITIAL_DELAY:30s}
weav.workflow.execution.recovery.queued-delivery-age=${WORKFLOW_EXECUTION_RECOVERY_QUEUED_DELIVERY_AGE:1m}
weav.workflow.execution.recovery.outbox-cooldown=${WORKFLOW_EXECUTION_RECOVERY_OUTBOX_COOLDOWN:1m}

# ==================================================
# HikariCP
# ==================================================
# Đang limit số lượng kết nối tối đa để tránh quá tải cơ sở dữ liệu là 3, sau này có thêm database thì sẽ tăng lên

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

weav.jwt.access-secret=${JWT_ACCESS_SECRET}
weav.jwt.issuer=${JWT_ISSUER:weav-identity}
weav.jwt.audience=${JWT_AUDIENCE:weav-api}
weav.jwt.clock-skew=${JWT_CLOCK_SKEW:30s}

# ==================================================
# Workspace authorization and connection contracts
# ==================================================

weav.internal.service-key=${WORKFLOW_INTERNAL_SERVICE_KEY:}
weav.workspace.base-url=${WORKSPACE_SERVICE_URL:http://localhost:8082}
weav.workspace.connect-timeout=${WORKSPACE_CONNECT_TIMEOUT:3s}
weav.workspace.read-timeout=${WORKSPACE_READ_TIMEOUT:5s}
weav.workspace.internal-service-key=${WEAV_INTERNAL_SERVICE_KEY:}

# OCR execution remains disabled until the OCR verifier and source controls are independently proven.
weav.workflow.ocr.enabled=${WORKFLOW_OCR_ENABLED:false}
weav.workflow.ocr.url-source-enabled=${WORKFLOW_OCR_URL_SOURCE_ENABLED:false}
weav.workflow.ocr.artifact-source-enabled=${WORKFLOW_OCR_ARTIFACT_SOURCE_ENABLED:false}
weav.workflow.ocr.service-claims-verified=${WORKFLOW_OCR_SERVICE_CLAIMS_VERIFIED:false}
weav.workflow.ocr.url-allowlist-verified=${WORKFLOW_OCR_URL_ALLOWLIST_VERIFIED:false}
weav.workflow.ocr.artifact-resolver-verified=${WORKFLOW_OCR_ARTIFACT_RESOLVER_VERIFIED:false}
weav.workflow.ocr.base-url=${OCR_SERVICE_PRIVATE_URL:http://ocr-service:8000}
weav.workflow.ocr.key-id=${WORKFLOW_OCR_SIGNING_KEY_ID:}
weav.workflow.ocr.private-key-location=${WORKFLOW_OCR_SIGNING_KEY_LOCATION:}
weav.workflow.ocr.connect-timeout=${WORKFLOW_OCR_CONNECT_TIMEOUT:5s}
weav.workflow.ocr.read-timeout=${WORKFLOW_OCR_READ_TIMEOUT:30s}
weav.workflow.ocr.token-lifetime=${WORKFLOW_OCR_TOKEN_LIFETIME:60s}
weav.workflow.ocr.max-response-bytes=${WORKFLOW_OCR_MAX_RESPONSE_BYTES:1048576}
