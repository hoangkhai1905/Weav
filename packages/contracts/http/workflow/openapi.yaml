openapi: 3.1.0
info:
  title: Weav Workflow Service API
  version: 1.0.0
  description: >-
    Workflow resource, execution, schedule, and webhook contract. The API
    Gateway adds the /api/v1 prefix to public resource paths; Workflow Service
    receives the paths shown here. The internal usage operation below is also
    consumed by Workspace Service.
servers:
  - url: http://localhost:8080
    description: Local Workflow service
tags:
  - name: Workflows
    description: Workspace-scoped workflow authoring and lifecycle operations
  - name: Executions
    description: Manual execution admission and authorized monitoring
  - name: Internal
    description: Service-to-service operations
  - name: Templates
    description: Shared workflow templates (W6-C1) - share, browse and copy sanitized snapshots
paths:
  /workspaces/{workspaceId}/workflows:
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Create a workflow draft
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkflowRequest' }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: List workflows visible in a workspace
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged workflow summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}:
    get:
      tags: [Workflows]
      operationId: getWorkflow
      summary: Get a workflow
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      responses:
        '200':
          description: Workflow metadata and editable state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Workflows]
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: >-
        Soft-deletes the workflow and disables its current triggers, so schedules and webhooks stop admitting
        work. Runs already admitted finish. The workflow, its versions, and its run history are no longer
        readable. Its draft stops counting as connection usage; its published versions still count.
        Requires WORKFLOW_MANAGE_STATE.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      responses:
        '204':
          description: Workflow deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/generate:
    post:
      tags: [Workflows]
      operationId: generateWorkflow
      summary: Generate an unsaved workflow draft from a prompt
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateWorkflowRequest' }
      responses:
        '200':
          description: Generated workflow intent result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateWorkflowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}/draft:
    put:
      tags: [Workflows]
      operationId: saveWorkflowDraft
      summary: Save a workflow draft
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWorkflowDraftRequest' }
      responses:
        '200':
          description: Draft saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}/publish:
    post:
      tags: [Workflows]
      operationId: publishWorkflow
      summary: Publish an immutable workflow version
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      responses:
        '200':
          description: >-
            Published version. Each webhook registration of a newly created version is provisioned with a new
            endpoint key and secret; plaintext secrets are returned once and are write-only thereafter.
            Republishing a draft identical to the active published version is a no-op: it returns the existing
            version with an empty webhooks list and creates no version, secret, or event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowPublication' }
          headers:
            Cache-Control:
              description: Prevents storage of a response containing one-time webhook secrets.
              schema: { type: string, const: no-store }
        '400':
          description: Validation failure with bounded field or node diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Conflict, including TELEGRAM_BOT_IN_USE when another workflow already has an active trigger.telegram
            on the same Telegram connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: >-
            TELEGRAM_WEBHOOK_REGISTRATION_FAILED: Telegram rejected setWebhook or could not be reached; nothing
            was published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: A required trigger or connection-reference dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}/pause:
    post:
      tags: [Workflows]
      operationId: pauseWorkflow
      summary: Pause a published workflow
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      responses:
        '200':
          description: Workflow paused; new manual and automatic triggers are rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}/resume:
    post:
      tags: [Workflows]
      operationId: resumeWorkflow
      summary: Resume a paused workflow
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      responses:
        '200':
          description: Workflow resumed for its current published version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}/executions:
    post:
      tags: [Executions]
      operationId: createManualExecution
      summary: Start a manual execution
      description: >-
        Requires WORKFLOW_RUN. The workflow must be PUBLISHED. The execution,
        initial node rows, and durable outbox intent are committed before 202
        is returned. The request input must be a JSON object. An optional
        Idempotency-Key makes retries safe: the same key with the same input
        returns the original 202 body without a second execution; the same
        key with a different input returns 422 IDEMPOTENCY_KEY_REUSED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualExecutionRequest' }
      responses:
        '202':
          description: Execution and outbox intent committed and queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '422': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Executions]
      operationId: listExecutions
      summary: List execution summaries
      description: Requires WORKFLOW_MONITOR and exact workspace/workflow scoping.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Stable page ordered by created time and ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/workflows/{workflowId}/executions/{executionId}:
    get:
      tags: [Executions]
      operationId: getExecution
      summary: Get execution state and sanitized logs
      description: >-
        Requires WORKFLOW_MONITOR. The tuple workspaceId, workflowId, and
        executionId is checked together. Logs default to page 0 and size 20,
        accept at most 100 entries per page, and expose hasNext. Persisted
        output, errors, metadata, and messages are deeply sanitized before
        serialization; credentials are never returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
        - { $ref: '#/components/parameters/ExecutionId' }
        - $ref: '#/components/parameters/LogPage'
        - $ref: '#/components/parameters/LogSize'
      responses:
        '200':
          description: Execution, node states, attempts, and bounded log page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/executions:
    get:
      tags: [Monitoring]
      operationId: listWorkspaceExecutions
      summary: Workspace-wide run history
      description: >-
        Requires WORKFLOW_MONITOR. Runs of every non-deleted workflow in the
        workspace, newest first (created time, then ID). Filters are optional
        and combine with AND. The time range is always capped at 90 days: a
        missing from defaults to (to, or now) minus 90 days, a missing to
        leaves the range open upwards, and from and to together must be
        positive and span at most 90 days (400 otherwise). to is exclusive.
        Use createdAt for ordering; startedAt is null while
        a run is queued. errorCode and errorMessage come from the stored run
        error, redacted and truncated to 300 characters.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [QUEUED, RUNNING, WAITING, SUCCESS, FAILED, CANCELLED] }
        - name: workflowId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on the run creation time (ISO-8601 instant).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on the run creation time (ISO-8601 instant).
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Page of runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceRunPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/monitoring/summary:
    get:
      tags: [Monitoring]
      operationId: getMonitoringSummary
      summary: Workspace metrics summary
      description: >-
        Requires WORKFLOW_MONITOR. Aggregated in SQL over runs created in the
        last N UTC calendar days (including today). Day buckets and "today"
        use UTC. successRate is SUCCESS / (SUCCESS + FAILED), a fraction in
        [0, 1], null when no run has finished; averageDurationMs and
        p95DurationMs cover finished runs with both timestamps and are null
        when there are none. trend has one entry per day, zero-filled.
        topFailingWorkflows (at most 5) and recentFailures (at most 5) cover
        the same range.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/alert-rules:
    get:
      tags: [Monitoring]
      operationId: listAlertRules
      summary: List alert rules
      description: Requires WORKFLOW_MONITOR.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
      responses:
        '200':
          description: All rules of the workspace (at most maxRules).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Monitoring]
      operationId: createAlertRule
      summary: Create an alert rule
      description: >-
        Requires WORKFLOW_EDIT. At most 20 rules per workspace (409 beyond).
        CONSECUTIVE_FAILURES needs threshold 1..20 and windowMinutes 1..10080;
        LONG_RUNNING needs threshold 1..86400 seconds and no windowMinutes;
        it fires when a run passes the threshold, while it is still running
        (checked about every minute) or, at the latest, when it finishes.
        workflowId, when present, must be a non-deleted workflow of this
        workspace (400 otherwise); null means every workflow. cooldownMinutes
        defaults to 60 (0..10080). A rule fires at most once per run and not
        again for the same workflow within its cooldown; matching runs enqueue
        monitoring.alert.* notifications for the rule creator and the workflow
        creator.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /workspaces/{workspaceId}/alert-rules/{ruleId}:
    put:
      tags: [Monitoring]
      operationId: updateAlertRule
      summary: Replace an alert rule
      description: Requires WORKFLOW_EDIT. Full replacement; an omitted enabled keeps the stored value.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/RuleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Monitoring]
      operationId: deleteAlertRule
      summary: Delete an alert rule
      description: Requires WORKFLOW_EDIT. Deletes the rule and its firing history.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/RuleId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- W6-C1 shared templates ------------------------------------------------
  /workspaces/{workspaceId}/workflows/{workflowId}/template/preview:
    post:
      tags: [Templates]
      operationId: previewWorkflowTemplate
      summary: Preview what sharing this workflow would remove
      description: >-
        Requires WORKFLOW_EDIT. Sanitizes the current draft exactly as sharing
        would and writes nothing. removedFields lists connection references and
        personal fields (x-weav-personal node schema fields that are not a
        single mapping expression) that sharing deletes; warnings lists free
        text that looks like an e-mail address (EMAIL) or a token (TOKEN) and
        is kept, for the owner to review. existing is this workflow's current
        template, if any. 400 TEMPLATE_NODE_NOT_SHAREABLE when a node has a
        type the catalog does not know (the message names the node id).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      responses:
        '200':
          description: The sanitized snapshot and what was changed in it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /workspaces/{workspaceId}/workflows/{workflowId}/template:
    put:
      tags: [Templates]
      operationId: shareWorkflowAsTemplate
      summary: Share this workflow as a template (create or refresh)
      description: >-
        Requires WORKFLOW_EDIT. Stores a sanitized snapshot. Sharing the same
        workflow again updates its template (same id and shareCode) and returns
        200; the first share returns 201. 409 TEMPLATE_LIMIT_REACHED beyond 50
        live templates per user; 409 TEMPLATE_OWNED_BY_OTHER when another
        member already shared this workflow; 400 for a workflow without steps
        and 400 TEMPLATE_NODE_NOT_SHAREABLE for a node of unknown type. Request
        bodies of the template routes are capped at 16 KB (400 beyond); unknown
        fields, duplicate keys and trailing content are 400; null = absent for
        the optional string fields.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkflowId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareTemplateRequest' }
      responses:
        '200':
          description: Existing template refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '201':
          description: Template created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: Browse templates
      description: >-
        scope=public (default): the gallery, most used first. scope=workspace:
        PRIVATE templates shared from workspaceId (needs membership, 403
        otherwise; workspaceId is required, 400 otherwise). scope=mine: every
        template the caller owns, any visibility. q matches name or
        description, case-insensitively.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [public, workspace, mine], default: public } }
        - { name: workspaceId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: A page of template summaries (no definition).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /templates/by-code/{code}:
    get:
      tags: [Templates]
      operationId: getTemplateByCode
      summary: Open a template by its share code
      description: >-
        The code is case-insensitive and ignores spaces and dashes (wv7k-3m9q
        resolves WV7K3M9Q); I and L read as 1, O as 0. Only UNLISTED and PUBLIC
        templates resolve; a PRIVATE or unknown code is 404. Rate limited
        (gateway template bucket).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /templates/{templateId}:
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Read a template
      description: >-
        Visible to the owner, anyone for PUBLIC and UNLISTED, and workspace
        members for PRIVATE. A hidden template is 404, never 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Templates]
      operationId: updateTemplate
      summary: Rename, re-describe or change the visibility of a template
      description: >-
        The owner may change any field. A system ADMIN may only set a PUBLIC
        template to PRIVATE (unpublish); any other change by a non-owner is
        403. Absent fields stay unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchTemplateRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Templates]
      operationId: deleteTemplate
      summary: Delete a template
      description: Owner only (soft delete). The share code stops resolving.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /templates/{templateId}/use:
    post:
      tags: [Templates]
      operationId: useTemplate
      summary: Copy a template into a workspace as a new draft workflow
      description: >-
        The caller must see the template (404 otherwise) and have
        WORKFLOW_CREATE in workspaceId (403). Creates the draft and counts the
        use in one transaction. The copy carries no connection ids: the user
        re-picks them in the builder. name defaults to the template name.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UseTemplateRequest' }
      responses:
        '201':
          description: Draft workflow created.
          content:
            application/json:
              schema:
                type: object
                required: [workflowId]
                properties:
                  workflowId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /webhooks/{endpointKey}:
    post:
      tags: [Executions]
      operationId: receiveWebhook
      summary: Receive a workflow webhook
      description: >-
        Authenticates the opaque endpoint identifier with X-Webhook-Secret;
        no user JWT is required. The accepted JSON value becomes trigger.input.
        Unknown, missing, wrong, inactive, paused, or superseded registrations
        all return the same generic 404. The endpoint identifier and secret
        must be redacted from logs, metrics, and traces. Request bodies are
        limited to 1 MiB. Rate limits (429) are spent only by authenticated
        requests: per endpoint, plus a shared process-wide ceiling. An optional
        Idempotency-Key makes provider redeliveries safe: the same key with the
        same body returns the original 202 body without a second execution;
        the same key with a different body returns 422 IDEMPOTENCY_KEY_REUSED.
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: endpointKey
          in: path
          required: true
          description: Opaque 24-byte random identifier encoded as unpadded base64url.
          schema: { type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$' }
        - name: X-Webhook-Secret
          in: header
          required: true
          description: Required high-entropy webhook secret; never returned after one-time publication.
          schema: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
      requestBody:
        required: false
        description: Any JSON value; raw request bodies larger than 1 MiB are rejected before parsing.
        content:
          application/json:
            schema:
              description: Any JSON value, including null. An empty body is treated as null.
              oneOf:
                - { type: object, additionalProperties: true }
                - { type: array, items: {} }
                - { type: string }
                - { type: number }
                - { type: boolean }
                - { type: 'null' }
      responses:
        '202':
          description: Execution, pending node rows, and outbox intent committed after durable admission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/WebhookNotFound' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /webhooks/telegram/{endpointKey}:
    post:
      tags: [Executions]
      operationId: receiveTelegramUpdate
      summary: Receive a Telegram bot update for a trigger.telegram registration
      description: >-
        Called by Telegram, not by users: publishing a workflow with trigger.telegram registers this URL (built
        from WORKFLOW_PUBLIC_BASE_URL, through the gateway) with the Bot API setWebhook and a random secret_token.
        The X-Telegram-Bot-Api-Secret-Token header is compared in constant time with the stored hash. Unknown,
        missing, wrong, inactive, paused, superseded, or non-Telegram registrations all return the same generic
        404. A text message starts one execution with trigger.input
        {updateId, message: {messageId, date, text, chat: {id, type}, from: {id, username, firstName}}}
        (only fields present); update_id is the idempotency key, so redeliveries return 200 without a second
        execution. Updates without a text message are acknowledged with 200 and start nothing.
      security: []
      parameters:
        - name: endpointKey
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$' }
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          description: secret_token supplied to setWebhook; never returned after publication.
          schema: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]{1,256}$', writeOnly: true }
      requestBody:
        required: true
        description: Telegram Update object; bodies larger than 1 MiB are rejected before parsing.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Update acknowledged (execution admitted, duplicate, or nothing to run).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/WebhookNotFound' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/workspaces/{workspaceId}/connections/{connectionId}/usage:
    get:
      tags: [Internal]
      operationId: getConnectionUsage
      summary: Check whether a workspace connection is referenced by a workflow
      security:
        - internalServiceKey: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Authoritative usage state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionUsageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/workspaces/{workspaceId}/pause-all:
    post:
      tags: [Internal]
      operationId: pauseAllWorkspaceWorkflows
      summary: Pause every published workflow of a workspace that is being deleted
      description: >-
        Called only by the Workspace Service, just before it soft-deletes the workspace and wipes its
        credentials (unregistering a Telegram bot needs its credential). Pauses each PUBLISHED workflow
        and disables its current triggers, like a member pausing it, but without a capability check and
        without per-workflow workflow.paused notifications. Idempotent and retriable. Executions already
        admitted are left to finish or fail when they next resolve a connection. Telegram webhook removal
        is best effort and counted, never fatal.
      security:
        - internalServiceKey: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Shutdown counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePauseAllResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client-generated key (reuse it on retry). Scoped to the workflow.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    LogPage:
      name: logPage
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    LogSize:
      name: logSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    ConnectionUsageResponse:
      type: object
      additionalProperties: false
      required: [inUse]
      properties:
        inUse: { type: boolean }
    WorkspacePauseAllResponse:
      type: object
      additionalProperties: false
      required: [paused, alreadyPaused, failedTelegramUnregister, failed]
      properties:
        paused: { type: integer, minimum: 0, description: Workflows paused by this call. }
        alreadyPaused: { type: integer, minimum: 0, description: Workflows that were already paused. }
        failedTelegramUnregister: { type: integer, minimum: 0, description: Telegram bots whose webhook could not be removed. }
        failed: { type: integer, minimum: 0, description: Workflows that could not be paused (logged and skipped; the caller must retry when above 0). }
    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000 }

    GenerateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        timezone: { type: [string, 'null'] }
        connections:
          type: object
          additionalProperties:
            type: string
            format: uuid
        answers:
          type: object
          description: >-
            The user's replies to an earlier needs_input question, keyed by that question's `field`
            (for example `email.send.body`). Send the original prompt again together with the answers.
          maxProperties: 10
          additionalProperties: { type: string, minLength: 1, maxLength: 4000 }

    GenerateWorkflowResponse:
      oneOf:
        - type: object
          required: [status, name, definition, layout]
          properties:
            status: { const: ready }
            name: { type: string }
            definition: { type: object }
            layout: { type: object, additionalProperties: { type: object } }
        - type: object
          required: [status, questions]
          properties:
            status: { const: needs_input }
            questions: { type: array, items: { type: object } }
        - type: object
          required: [status, reasons]
          properties:
            status: { const: unsupported }
            reasons: { type: array, items: { type: object } }
    SaveWorkflowDraftRequest:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000 }
        definition: { type: object, additionalProperties: true }
        editorState: { type: object, additionalProperties: true }
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Revision of the draft the client loaded. When present and different from the stored revision the save
            fails with 409 DRAFT_REVISION_CONFLICT (error.details[0].message carries the current revision). Omit for
            last-write-wins.
    WorkflowCreated:
      type: object
      additionalProperties: false
      required: [workflowId, status]
      properties:
        workflowId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
    Workflow:
      type: object
      additionalProperties: true
      required: [workflowId, status]
      properties:
        workflowId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
        revision: { type: integer, format: int64, minimum: 0, description: Draft revision; incremented on every draft save. }
        triggers:
          type: array
          description: Safe readiness and timing projection for the workflow's current trigger registrations.
          items:
            type: object
            additionalProperties: false
            required: [triggerId, type, status, reasonCode, nextRunAt, lastTriggeredAt]
            properties:
              triggerId: { type: string, format: uuid }
              type: { type: string, enum: [SCHEDULE, WEBHOOK, TELEGRAM, GMAIL] }
              status: { type: string, enum: [ACTIVE, DISABLED] }
              reasonCode:
                type: string
                enum: [DEPENDENCY_NOT_CONFIGURED, SCHEDULE_ADMISSION_FAILED, CONNECTION_RECONNECT_REQUIRED, AUTHENTICATION_REJECTED, CONNECTION_FORBIDDEN, CONNECTION_UNAVAILABLE, GMAIL_POLL_FAILED, GMAIL_MESSAGE_SKIPPED, GMAIL_BACKLOG_TRUNCATED]
                nullable: true
              nextRunAt: { type: string, format: date-time, nullable: true }
              lastTriggeredAt: { type: string, format: date-time, nullable: true }
    WorkflowSummary:
      type: object
      additionalProperties: true
      required: [workflowId, status]
      properties:
        workflowId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
    WorkflowPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkflowSummary' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    WorkflowPublication:
      type: object
      required: [workflowId, versionId, version, status, webhooks]
      properties:
        workflowId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [PUBLISHED] }
        webhooks:
          type: array
          description: Newly provisioned webhook registrations. Each secret is returned only once.
          items: { $ref: '#/components/schemas/WebhookProvisioning' }
    WebhookProvisioning:
      type: object
      required: [triggerId, endpointKey, secret]
      properties:
        triggerId: { type: string, format: uuid }
        endpointKey: { type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$' }
        secret:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: One-time plaintext provisioning value. Never returned by later reads.
    ManualExecutionRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
    ExecutionAccepted:
      type: object
      required: [executionId, workflowId, workflowVersionId, status]
      properties:
        executionId: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        workflowVersionId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED] }
    ExecutionSummary:
      type: object
      required: [executionId, workflowId, workflowVersionId, status, triggerType, createdAt]
      properties:
        executionId: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        workflowVersionId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, WAITING, SUCCESS, FAILED, CANCELLED] }
        triggerType: { type: string, enum: [MANUAL, SCHEDULE, WEBHOOK, TELEGRAM, GMAIL] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    ExecutionPage:
      type: object
      required: [items, page, size, totalElements, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExecutionSummary' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    ExecutionDetail:
      allOf:
        - $ref: '#/components/schemas/ExecutionSummary'
        - type: object
          required: [nodes, logs]
          properties:
            nodes: { type: array, items: { $ref: '#/components/schemas/NodeState' } }
            logs: { $ref: '#/components/schemas/LogPage' }
    NodeState:
      type: object
      required: [nodeExecutionId, nodeId, nodeType, status, attemptCount, attempts]
      properties:
        nodeExecutionId: { type: string, format: uuid }
        nodeId: { type: string }
        nodeType: { type: string }
        status: { type: string, enum: [PENDING, READY, RUNNING, WAITING, SUCCESS, FAILED, SKIPPED, CANCELLED] }
        attemptCount: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        output:
          nullable: true
          description: Sanitized JSON value; provider credentials are removed.
        error:
          nullable: true
          description: Sanitized JSON value; provider credentials are removed.
        attempts: { type: array, items: { $ref: '#/components/schemas/AttemptState' } }
    AttemptState:
      type: object
      required: [attemptId, attemptNumber, status, startedAt]
      properties:
        attemptId: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [RUNNING, SUCCESS, FAILED, CANCELLED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        output:
          nullable: true
          description: Sanitized JSON value; provider credentials are removed.
        error:
          nullable: true
          description: Sanitized JSON value; provider credentials are removed.
    LogPage:
      type: object
      required: [items, page, size, totalElements, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    LogEntry:
      type: object
      required: [id, level, eventType, createdAt]
      properties:
        id: { type: string, format: uuid }
        nodeExecutionId: { type: string, format: uuid, nullable: true }
        attemptId: { type: string, format: uuid, nullable: true }
        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        eventType: { type: string }
        message: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, timestamp, status, path]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        path: { type: string }
    WorkspaceRun:
      type: object
      required: [executionId, workflowId, workflowName, status, triggerType, createdAt]
      properties:
        executionId: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        workflowName: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, WAITING, SUCCESS, FAILED, CANCELLED] }
        triggerType: { type: string, enum: [MANUAL, SCHEDULE, WEBHOOK, TELEGRAM, GMAIL] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true, description: Present when both startedAt and finishedAt are. }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true, maxLength: 301 }
    WorkspaceRunPage:
      type: object
      required: [items, page, size, totalElements, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkspaceRun' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    MonitoringSummary:
      type: object
      required: [days, from, to, workflows, runs, successRate, averageDurationMs, p95DurationMs, trend, topFailingWorkflows, recentFailures]
      properties:
        days: { type: integer, minimum: 1, maximum: 30 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        workflows:
          type: object
          required: [published, paused, draft]
          properties:
            published: { type: integer, format: int64 }
            paused: { type: integer, format: int64 }
            draft: { type: integer, format: int64 }
        runs:
          type: object
          required: [total, today, success, failed, active]
          properties:
            total: { type: integer, format: int64 }
            today: { type: integer, format: int64 }
            success: { type: integer, format: int64 }
            failed: { type: integer, format: int64 }
            active: { type: integer, format: int64, description: QUEUED, RUNNING or WAITING. }
        successRate: { type: number, minimum: 0, maximum: 1, nullable: true }
        averageDurationMs: { type: integer, format: int64, nullable: true }
        p95DurationMs: { type: integer, format: int64, nullable: true }
        trend:
          type: array
          items:
            type: object
            required: [date, total, success, failed]
            properties:
              date: { type: string, format: date }
              total: { type: integer, format: int64 }
              success: { type: integer, format: int64 }
              failed: { type: integer, format: int64 }
        topFailingWorkflows:
          type: array
          maxItems: 5
          items:
            type: object
            required: [workflowId, workflowName, failures, lastFailureAt]
            properties:
              workflowId: { type: string, format: uuid }
              workflowName: { type: string }
              failures: { type: integer, format: int64 }
              lastFailureAt: { type: string, format: date-time }
        recentFailures:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/WorkspaceRun' }
    AlertRuleRequest:
      type: object
      required: [name, type, threshold]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [CONSECUTIVE_FAILURES, LONG_RUNNING] }
        workflowId: { type: string, format: uuid, nullable: true }
        threshold: { type: integer, minimum: 1, maximum: 86400, description: Failures in a row (1..20) or seconds. }
        windowMinutes: { type: integer, minimum: 1, maximum: 10080, nullable: true }
        cooldownMinutes: { type: integer, minimum: 0, maximum: 10080, default: 60 }
        enabled: { type: boolean }
    AlertRule:
      type: object
      required: [id, workspaceId, name, type, threshold, cooldownMinutes, enabled, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workflowId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { type: string, enum: [CONSECUTIVE_FAILURES, LONG_RUNNING] }
        threshold: { type: integer }
        windowMinutes: { type: integer, nullable: true }
        cooldownMinutes: { type: integer }
        enabled: { type: boolean }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertRuleList:
      type: object
      required: [items, maxRules]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
        maxRules: { type: integer, example: 20 }
    # ---- W6-C1 shared templates
    TemplateVisibility:
      type: string
      enum: [PRIVATE, UNLISTED, PUBLIC]
      description: PRIVATE = members of the source workspace; UNLISTED = anyone with the code or id; PUBLIC = gallery.
    ShareTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000, description: 'null = absent.' }
        authorName: { type: string, nullable: true, maxLength: 120, description: 'Display name snapshot chosen by the client. null = absent.' }
        visibility: { $ref: '#/components/schemas/TemplateVisibility' }
    PatchTemplateRequest:
      type: object
      additionalProperties: false
      description: Request bodies are capped at 16 KB. null = absent (field unchanged).
      properties:
        name: { type: string, nullable: true, minLength: 1, maxLength: 255, description: 'null = absent.' }
        description: { type: string, nullable: true, maxLength: 2000, description: 'A blank string clears it; null = absent (unchanged).' }
        visibility:
          nullable: true
          description: 'null = absent.'
          allOf:
            - { $ref: '#/components/schemas/TemplateVisibility' }
    UseTemplateRequest:
      type: object
      additionalProperties: false
      required: [workspaceId]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string, nullable: true, minLength: 1, maxLength: 255, description: 'null = absent (template name is used).' }
    TemplateSummary:
      type: object
      required: [id, name, nodeTypes, visibility, usageCount, createdAt, updatedAt, owned]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        authorName: { type: string, nullable: true }
        nodeTypes: { type: array, items: { type: string }, description: Distinct node types in definition order. }
        visibility: { $ref: '#/components/schemas/TemplateVisibility' }
        usageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        owned: { type: boolean, description: True when the caller is the owner. }
    TemplateDetail:
      allOf:
        - { $ref: '#/components/schemas/TemplateSummary' }
        - type: object
          required: [definition]
          properties:
            definition: { type: object, additionalProperties: true, description: Sanitized workflow definition (schemaVersion, nodes, edges, variables). }
            editorState: { type: object, additionalProperties: true, nullable: true, description: Only nodes.<id>.name and nodes.<id>.position. }
            shareCode: { type: string, minLength: 8, maxLength: 8, description: Owner only. }
            workspaceId: { type: string, format: uuid, description: Owner only. }
            sourceWorkflowId: { type: string, format: uuid, description: Owner only. }
    TemplatePage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TemplateSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    TemplatePreview:
      type: object
      required: [definition, removedFields, warnings]
      properties:
        definition: { type: object, additionalProperties: true }
        editorState: { type: object, additionalProperties: true, nullable: true }
        removedFields:
          type: array
          items:
            type: object
            required: [nodeId, field]
            properties:
              nodeId: { type: string }
              field: { type: string }
        warnings:
          type: array
          items:
            type: object
            required: [nodeId, field, reason]
            properties:
              nodeId: { type: string }
              field: { type: string }
              reason: { type: string, enum: [EMAIL, TOKEN] }
        existing:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/TemplateDetail' }
  responses:
    BadRequest:
      description: Malformed JSON, invalid UUID, validation, or pagination bounds.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid user JWT or internal service key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The authenticated principal lacks the operation capability.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The resource or exact scoped execution tuple was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    WebhookNotFound:
      description: The endpoint is unknown or its secret is invalid, missing, inactive, paused, or superseded. The same response is used for all these cases.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Concurrent draft or persistence state conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StateConflict:
      description: The requested lifecycle or execution operation is invalid for the current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used with a different request body (code IDEMPOTENCY_KEY_REUSED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTooLarge:
      description: Raw request body exceeded the bounded request size before JSON binding.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: A bounded process-wide ingress or usage lookup rate limit was exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Workflow Service failed internally. Details are sanitized.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
