openapi: 3.1.0
info:
  title: Weav Workspace API
  version: 1.0.0
  description: >-
    Workspace and membership contracts for the V1 Workspace Service. PostgreSQL
    owns workspace state; Identity owns user profile data and access-token
    issuance.
servers:
  - url: http://localhost:8080
    description: Local Workspace service
tags:
  - name: Workspaces
  - name: Members
  - name: Invitations
  - name: Connections
  - name: OAuth
  - name: Internal
security:
  - bearerAuth: []
paths:
  /workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace for the authenticated user
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional retry key (8-128 chars of A-Za-z0-9._:-). Same key and body replays the original workspace; same key with a different body returns 422 IDEMPOTENCY_KEY_REUSED. Keys expire after 7 days.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created with the caller as its OWNER.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Workspaces]
      operationId: listMyWorkspaces
      summary: List workspaces visible to the authenticated user
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/WorkspaceRole'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/WorkspaceSort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Page of accessible workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get an accessible workspace
      responses:
        '200':
          description: Workspace details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Workspaces]
      operationId: renameWorkspace
      summary: Rename an owned workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameWorkspaceRequest'
      responses:
        '200':
          description: Workspace renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete an owned workspace (soft delete)
      description: >-
        Owner only. The body carries the workspace name as a typed confirmation (compared trimmed and
        case-insensitively like the unique-name rule). The Workflow Service is asked to pause every workflow
        first; if that fails (or any workflow cannot be paused) the call returns 503 and the workspace is not
        deleted, although some workflows may already be paused, so it can simply be retried. Then the
        workspace is marked DELETED (hidden from every list and lookup, its name becomes reusable), all of
        its connections are disabled, their credentials are deleted and every other member receives a
        workspace.deleted notification. Deleting an already deleted workspace is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkspaceRequest'
      responses:
        '204':
          description: Workspace deleted; no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Members]
      operationId: listWorkspaceMembers
      summary: List enriched members of an accessible workspace
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/MemberRole'
        - name: canPublishWorkflow
          in: query
          required: false
          schema:
            type: boolean
        - name: canManageWorkflowState
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/MemberSort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Page of members enriched from Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Members]
      operationId: addWorkspaceMember
      summary: Add an existing active Identity user by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/members/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      operationId: updateWorkspaceMemberPermissions
      summary: Update a member's optional workflow permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberPermissionsRequest'
      responses:
        '200':
          description: Member permissions updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Members]
      operationId: removeWorkspaceMember
      summary: Remove a MEMBER from an owned workspace
      responses:
        '204':
          description: Membership removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/members/me:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    delete:
      tags: [Members]
      operationId: leaveWorkspace
      summary: Leave a workspace as the authenticated MEMBER
      responses:
        '204':
          description: Membership removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---- W7-A1: invite by e-mail (owner side) ----
  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Invitations]
      operationId: listWorkspaceInvitations
      summary: List pending invitations (including expired ones) of a workspace; OWNER only
      responses:
        '200':
          description: Pending invitations, newest first, at most 50.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Invitations]
      operationId: createWorkspaceInvitation
      summary: Invite an e-mail address that has no Weav account; OWNER only
      description: >-
        Error codes: 409 USER_EXISTS (an active account exists, add the member directly), USER_INACTIVE,
        INVITATION_EXISTS (a live pending invitation exists); 429 INVITATION_LIMIT (50 pending per workspace).
        Pending invitations expire after 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created; notification-service sends the e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Invitations]
      operationId: revokeWorkspaceInvitation
      summary: Revoke a pending invitation (live or expired); OWNER only
      responses:
        '204':
          description: Invitation revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      operationId: resendWorkspaceInvitation
      summary: Resend a live pending invitation, at most once per 10 minutes; OWNER only
      description: >-
        Extends the expiry to now + 7 days. 409 INVITATION_NOT_PENDING for expired or answered
        invitations (re-invite instead); 429 INVITATION_RESEND_TOO_SOON.
      responses:
        '200':
          description: Invitation re-sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---- W7-A1: invite by e-mail (invitee side) ----
  /workspaces/invitations:
    get:
      tags: [Invitations]
      operationId: listMyInvitations
      summary: Live pending invitations addressed to the caller's verified e-mail
      description: >-
        With an unverified e-mail the response is 200 with an empty list and emailVerified false.
        Invitations of soft-deleted workspaces are hidden.
      responses:
        '200':
          description: The caller's invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation and become a MEMBER (default permissions)
      description: >-
        The caller's verified e-mail must equal the invited e-mail; otherwise 404 INVITATION_NOT_FOUND.
        409 EMAIL_NOT_VERIFIED; 410 INVITATION_GONE for expired, revoked, declined or deleted-workspace
        invitations. Accepting twice returns 200 both times.
      responses:
        '200':
          description: The caller is a member of the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/invitations/{invitationId}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      operationId: declineInvitation
      summary: Decline an invitation
      responses:
        '204':
          description: Invitation declined.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Connections]
      operationId: createConnection
      summary: Create a disabled workspace connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Connection created in DISABLED state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List connections visible to the authenticated workspace member
      responses:
        '200':
          description: Connection metadata; config is null when the caller cannot manage the connection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get a workspace-scoped connection
      responses:
        '200':
          description: Secret-safe connection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Connections]
      operationId: updateConnection
      summary: Update connection name or provider configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
      responses:
        '200':
          description: Connection updated; a configuration change disables it pending another verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Connections]
      operationId: deleteConnection
      summary: Delete a connection after Workflow confirms it is unused
      responses:
        '204':
          description: Connection deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections/{connectionId}/credential:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    put:
      tags: [Connections]
      operationId: saveConnectionCredential
      summary: Replace a write-only connection credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCredentialRequest'
      responses:
        '200':
          description: Credential replaced and connection left DISABLED pending a provider test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Connections]
      operationId: deleteConnectionCredential
      summary: Remove a stored credential
      responses:
        '200':
          description: Credential removed; the response contains metadata only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections/{connectionId}/test:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Verify a connection credential with its provider
      responses:
        '200':
          description: Verification outcome; a confirmed authentication rejection marks the connection INVALID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidState'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections/{connectionId}/disable:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Connections]
      operationId: disableConnection
      summary: Manually disable a connection without changing its credential
      responses:
        '200':
          description: Connection is DISABLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections/{connectionId}/oauth/authorize:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [OAuth]
      operationId: startGoogleConnectionOAuth
      summary: Start Google authorization for a Gmail or Google Sheets connection
      responses:
        '200':
          description: Google authorization URL containing one-time state; the URL is sensitive and must not be logged.
          headers:
            Cache-Control:
              description: Set to no-store because the response contains one-time state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationHttpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /workspaces/{workspaceId}/connections/{connectionId}/oauth/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [OAuth]
      operationId: completeGoogleConnectionOAuthAuthenticated
      summary: Complete a pending Google authorization as the user who started it
      description: >-
        Consumes the single-use completion id parked by the public callback, requires the bearer subject
        and the path workspace/connection to match the initiating user and connection, then exchanges the
        code with the PKCE verifier, verifies the account and stores the encrypted credential. The id is
        consumed atomically before any check, so it can never be retried. A replayed, expired, malformed,
        unknown or mismatched id (wrong user, workspace or connection) all return the same 409, revealing
        nothing about the record. 403/404 only apply when the initiating user has since lost access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOAuthRequest'
      responses:
        '200':
          description: Verification outcome; the connection is ACTIVE when VERIFIED.
          headers:
            Cache-Control:
              description: Set to no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /oauth/google/callback:
    get:
      tags: [OAuth]
      operationId: completeGoogleConnectionOAuth
      summary: Receive the Google redirect and park the authorization code for authenticated completion
      description: >-
        This server-owned callback is the only unauthenticated application route. It consumes state once
        and parks the authorization code (with its PKCE verifier) under a random single-use completion id
        valid for five minutes. It stores no credential: the browser is not proven to belong to the user
        who started the flow, so the web app must call POST .../oauth/complete with a bearer token.
        It redirects only to the configured frontend return URL; client-supplied redirect targets are
        ignored. When state is invalid there is no trusted connection identifier, so the redirect omits
        connectionId.
      security: []
      parameters:
        - name: state
          in: query
          required: false
          description: Opaque one-time state returned by Google; never accepted as a connection identifier.
          schema:
            type: string
            maxLength: 128
        - name: code
          in: query
          required: false
          description: Google authorization code; consumed server-side and never reflected in a redirect.
          schema:
            type: string
            maxLength: 8192
        - name: error
          in: query
          required: false
          description: Provider denial indicator; its value is never reflected to the client.
          schema:
            type: string
            maxLength: 128
      responses:
        '302':
          description: >-
            Redirect to the configured frontend return URL with oauth=pending, completion and connectionId
            on success of the hand-off, or oauth=failed with reason one of state_invalid, authorization_denied
            or token_exchange_failed. Invalid state omits connectionId.
          headers:
            Location:
              description: Server-configured frontend return URL with safe OAuth result query parameters.
              schema:
                type: string
                format: uri
            Cache-Control:
              description: Set to no-store.
              schema:
                type: string
                const: no-store
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/workspaces/{workspaceId}/connections/{connectionId}/authorize-attachment:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Internal]
      operationId: authorizeConnectionAttachment
      summary: Authorize an authenticated workspace member to attach a connection to a workflow
      security:
        - internalServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeConnectionAttachmentRequest'
      responses:
        '204':
          description: Attachment is allowed for the requested member.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/workspaces/{workspaceId}/connections/{connectionId}/resolve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Internal]
      operationId: resolveConnectionCredential
      summary: Resolve minimum runtime authentication for an ACTIVE connection
      security:
        - internalServiceKey: []
      responses:
        '200':
          description: >-
            Runtime authentication only. This response contains secrets, omits Google refresh tokens,
            and is returned with Cache-Control: no-store.
          headers:
            Cache-Control:
              description: Set to no-store to prevent credential caching.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedConnectionHttpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidState'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/workspaces/{workspaceId}/connections/{connectionId}/auth-failure:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Internal]
      operationId: reportConnectionAuthFailure
      summary: Mark an ACTIVE connection INVALID after confirmed provider authentication rejection
      security:
        - internalServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportConnectionAuthFailureRequest'
      responses:
        '204':
          description: Confirmed authentication failure recorded; transient failures must not use this route.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/workspaces/{workspaceId}/users/{userId}/access:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal]
      operationId: getInternalWorkspaceAccess
      summary: Resolve a user's stable Workspace capability snapshot
      security:
        - internalServiceKey: []
      responses:
        '200':
          description: Capability snapshot for the requested membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity-issued access JWT.
    internalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
      description: V1 service-to-service authentication key; never place a real value in this contract.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceRole:
      name: role
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MembershipRole'
    MemberRole:
      name: role
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MembershipRole'
    WorkspaceSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [name, createdAt, updatedAt]
        default: name
    MemberSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [displayName, joinedAt, role]
        default: displayName
    Direction:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication or internal service-key verification failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller lacks the required capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is absent or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business or PostgreSQL uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required Identity, Workflow, Redis/Valkey, or provider dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: >-
        Resource state does not allow the requested operation. For the internal resolve route the
        additive code CONNECTION_RECONNECT_REQUIRED means the stored Google authorization is missing
        required scopes or was rejected; the user must reconnect the connection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The resource existed but can no longer be used (INVITATION_GONE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: A per-resource limit or cooldown was hit (INVITATION_LIMIT, INVITATION_RESEND_TOO_SOON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Sanitized unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                code: INTERNAL_ERROR
                message: An unexpected error occurred
                requestId: request-id

  schemas:
    CreateConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, provider, authType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ConnectionProvider'
        authType:
          $ref: '#/components/schemas/ConnectionAuthType'
        config:
          type: object
          additionalProperties: true
          description: Provider metadata; known credential fields and sensitive headers are rejected.
    UpdateConnectionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      anyOf:
        - required: [name]
        - required: [config]
          properties:
            config:
              type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        config:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: Provider metadata; known credential fields and sensitive headers are rejected; null is treated as omitted.
    SaveCredentialRequest:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: true
          description: Write-only provider authentication values; never returned in public responses.
        expiresAt:
          type: [string, 'null']
          format: date-time
    AuthorizeConnectionAttachmentRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    ReportConnectionAuthFailureRequest:
      type: object
      additionalProperties: false
      required: [failureCode]
      properties:
        failureCode:
          type: string
          enum: [AUTHENTICATION_REJECTED]
          description: Only a confirmed authentication rejection may mark an ACTIVE connection INVALID.
        credentialId:
          type: string
          format: uuid
          description: Optional. When present and not the connection's current credential id, the report is ignored (204) so a stale report cannot invalidate a replaced credential.
        credentialVersion:
          type: integer
          format: int64
          description: Optional. The credentialVersion returned by resolve. When present and different from the current credential's version, the credential was refreshed or replaced since it was resolved and the report is ignored (204).
    ConnectionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - createdBy
        - name
        - provider
        - authType
        - status
        - config
        - hasCredential
        - credentialExpiresAt
        - lastVerifiedAt
        - canManage
        - canAttach
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ConnectionProvider'
        authType:
          $ref: '#/components/schemas/ConnectionAuthType'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        config:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: Null when the caller may see metadata but cannot manage this connection.
        hasCredential:
          type: boolean
          description: Safe presence metadata; no credential identifier or secret is exposed.
        credentialExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Safe credential-expiry metadata.
        lastVerifiedAt:
          type: [string, 'null']
          format: date-time
        canManage:
          type: boolean
        canAttach:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConnectionProvider:
      type: string
      description: DISCORD, SLACK and TEAMS connections use authType TOKEN; the credential token is the channel or workflow webhook URL (write-only).
      enum: [TELEGRAM, HTTP, GMAIL, GOOGLE_SHEETS, GOOGLE_CALENDAR, GOOGLE_DRIVE, DISCORD, SLACK, TEAMS]
    ConnectionAuthType:
      type: string
      enum: [NONE, TOKEN, API_KEY, BASIC, OAUTH2]
    ConnectionStatus:
      type: string
      enum: [DISABLED, ACTIVE, INVALID]
    ConnectionTestResponse:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [VERIFIED, AUTH_INVALID]
    CompleteOAuthRequest:
      type: object
      additionalProperties: false
      required: [completion]
      properties:
        completion:
          type: string
          pattern: '^[A-Za-z0-9_-]{32,128}$'
          description: Single-use completion id from the oauth=pending redirect; a secret, do not log it.
    OAuthAuthorizationHttpResponse:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: Server-built Google authorization URL containing one-time state; do not log it.
    ResolvedConnectionHttpResponse:
      type: object
      additionalProperties: false
      required: [provider, authType, auth]
      properties:
        provider:
          $ref: '#/components/schemas/ConnectionProvider'
        authType:
          $ref: '#/components/schemas/ConnectionAuthType'
        auth:
          type: object
          additionalProperties:
            type: string
          description: >-
            Internal runtime authentication only. Google OAuth returns accessToken; the refresh token is never returned.
            Callers must not log or cache this response.
        credentialId:
          type: [string, 'null']
          format: uuid
          description: Current credential id; null when authType is NONE.
        credentialVersion:
          type: [integer, 'null']
          format: int64
          description: >-
            The credential's updatedAt as epoch milliseconds; changes on every refresh, save and reconnect.
            Echo it back on auth-failure so a stale report is ignored. Null when authType is NONE.
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
          description: Optional trimmed name; omitted/null generates My workspace N.
    RenameWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    DeleteWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The workspace name, typed by the owner to confirm the deletion.
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
    UpdateMemberPermissionsRequest:
      type: object
      additionalProperties: false
      required: [canPublishWorkflow, canManageWorkflowState]
      properties:
        canPublishWorkflow:
          type: boolean
        canManageWorkflowState:
          type: boolean
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspacePageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    MemberView:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - displayName
        - active
        - role
        - canPublishWorkflow
        - canManageWorkflowState
        - joinedAt
        - updatedAt
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 320
        displayName:
          type: [string, 'null']
          maxLength: 255
        active:
          type: boolean
        role:
          $ref: '#/components/schemas/MembershipRole'
        canPublishWorkflow:
          type: boolean
        canManageWorkflowState:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemberPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    MembershipRole:
      type: string
      enum: [OWNER, MEMBER]
    WorkspaceCapability:
      type: string
      enum:
        - WORKSPACE_VIEW
        - MEMBER_VIEW
        - WORKFLOW_CREATE
        - WORKFLOW_EDIT
        - WORKFLOW_RUN
        - WORKFLOW_MONITOR
        - WORKFLOW_PUBLISH
        - WORKFLOW_MANAGE_STATE
        - WORKSPACE_RENAME
        - MEMBER_ADD
        - MEMBER_REMOVE
        - MEMBER_MANAGE_PERMISSIONS
    WorkspaceAccessResponse:
      type: object
      additionalProperties: false
      required: [workspaceId, userId, role, capabilities]
      properties:
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MembershipRole'
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WorkspaceCapability'
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
    OwnerInvitation:
      type: object
      additionalProperties: false
      required: [id, workspaceId, email, status, invitedBy, createdAt, expiresAt, lastSentAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
          description: Canonical (trimmed, lower-case) invited address.
        status:
          type: string
          enum: [PENDING, EXPIRED, ACCEPTED, DECLINED, REVOKED]
        invitedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSentAt:
          type: string
          format: date-time
    OwnerInvitationListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OwnerInvitation'
    MyInvitation:
      type: object
      additionalProperties: false
      required: [id, workspaceId, workspaceName, invitedByName, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        invitedByName:
          type: string
        expiresAt:
          type: string
          format: date-time
    MyInvitationListResponse:
      type: object
      additionalProperties: false
      required: [items, emailVerified]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyInvitation'
        emailVerified:
          type: boolean
    AcceptInvitationResponse:
      type: object
      additionalProperties: false
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 512
        requestId:
          type: string
          maxLength: 128
