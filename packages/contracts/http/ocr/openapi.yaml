openapi: 3.1.0
info:
  title: Weav OCR Service API
  version: 1.0.0
  description: >-
    HTTP API contract for Weav OCR document extraction.
    Provides synchronous document text, bounding boxes, and optional table
    structures from images (PNG, JPEG, WEBP) and PDF documents.
    Generic OCR only — does not extract invoices, tax codes, or business entities.
paths:
  /api/v1/workspaces/{workspaceId}/ocr/extractions:
    post:
      summary: Extract document content (Public Gateway Ingress)
      description: >-
        Public extraction endpoint routed through API Gateway.
        Requires workspace execution authorization. Enforces rate limits, file limits,
        and translates valid caller requests to private OCR worker calls.
      operationId: extractOcrPublic
      tags:
        - extractions
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace UUID possessing the extraction context
          schema:
            type: string
            format: uuid
        - name: X-Request-ID
          in: header
          required: false
          description: Client-provided or Gateway-assigned UUID for end-to-end correlation
          schema:
            type: string
            format: uuid
        - name: traceparent
          in: header
          required: false
          description: W3C Trace Context traceparent header
          schema:
            type: string
      requestBody:
        required: true
        description: >-
          Document source and extraction options.
          Supports either multipart/form-data for direct file upload,
          or application/json for artifactId / approved fileUrl references.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file to extract (PNG, JPEG, WEBP, or PDF). Maximum 10 MiB, maximum 10 pages.
                language:
                  $ref: '#/components/schemas/LanguageOption'
                  default: 'vi+en'
                detectTables:
                  type: boolean
                  default: true
                  description: Whether to run optional table detection and structure recognition.
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequestJson'
      responses:
        '200':
          description: Extraction succeeded
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Correlation ID echoed from request or generated by service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrExtractionResult'
        '400':
          description: Invalid request syntax, multiple sources, or malformed multipart body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Missing, invalid, or expired authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Caller lacks workflow execution permission in the target workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Artifact not found, expired, deleted, or belongs to another workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '413':
          description: File size exceeds 10 MiB, page count exceeds 10, or dimensions exceed limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '415':
          description: Unsupported file media type (must be PNG, JPEG, WEBP, or PDF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Unprocessable document (corrupt file, encrypted PDF, animated WEBP, disallowed URL host)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Rate limit exceeded for workspace or user
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          description: Internal processing failure with sanitized error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '502':
          description: Upstream source fetch failed or table extraction engine crashed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: OCR engine busy or preloaded models not yet ready
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '504':
          description: Document extraction exceeded the processing deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /v1/extractions:
    post:
      summary: Extract document content (Private Service Ingress)
      description: >-
        Private extraction endpoint exposed only within the internal service network.
        Accepts requests exclusively from API Gateway and Workflow Service authenticated
        via short-lived asymmetric Service JWT.
      operationId: extractOcrPrivate
      tags:
        - extractions
      security:
        - ServiceJwtAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          description: Trace correlation UUID propagated by calling service
          schema:
            type: string
            format: uuid
        - name: traceparent
          in: header
          required: false
          description: W3C Trace Context traceparent header
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                language:
                  $ref: '#/components/schemas/LanguageOption'
                  default: 'vi+en'
                detectTables:
                  type: boolean
                  default: true
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequestJson'
      responses:
        '200':
          description: Extraction succeeded
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrExtractionResult'
        '400':
          description: Invalid request syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Invalid or expired Service JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Service JWT lacks required audience or scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Artifact not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '413':
          description: File size or document limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Corrupt document or disallowed source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Concurrency limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          description: Internal processing failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '502':
          description: Upstream fetch or table pipeline failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: Worker busy or model not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '504':
          description: Hard processing deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Public access JWT issued by Identity Service. Gateway validates token signature,
        expiration, and checks workspace membership.
    ServiceJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived asymmetric JWT minted by API Gateway or Workflow Service.
        Must include iss, aud='weav-ocr', scope='ocr:extract', workspace_id,
        and mode ('preview' or 'execution'). Maximum TTL: 120 seconds.

  schemas:
    LanguageOption:
      type: string
      enum:
        - vi
        - en
        - vi+en
      description: 'Language selection: vi (Vietnamese), en (English), or vi+en (multilingual bilingual, default).'

    ExtractionRequestJson:
      type: object
      required:
        - source
      properties:
        source:
          oneOf:
            - $ref: '#/components/schemas/ArtifactSource'
            - $ref: '#/components/schemas/UrlSource'
          discriminator:
            propertyName: type
        language:
          $ref: '#/components/schemas/LanguageOption'
          default: 'vi+en'
        detectTables:
          type: boolean
          default: true
          description: Whether to detect and extract table structures
      additionalProperties: false

    ArtifactSource:
      type: object
      required:
        - type
        - artifactId
      properties:
        type:
          type: string
          enum:
            - artifact
          description: Discriminator for managed workflow artifact source
        artifactId:
          type: string
          format: uuid
          description: UUID of pre-uploaded file artifact in Workflow storage
      additionalProperties: false

    UrlSource:
      type: object
      required:
        - type
        - fileUrl
      properties:
        type:
          type: string
          enum:
            - url
          description: Discriminator for external URL source
        fileUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 4096
          description: Allowlisted HTTPS URL to fetch the document from. Direct IP literals, localhost, and internal ranges are forbidden.
      additionalProperties: false

    OcrExtractionResult:
      type: object
      required:
        - schemaVersion
        - requestId
        - document
        - text
        - confidence
        - blocks
        - tables
        - metadata
      properties:
        schemaVersion:
          type: string
          enum:
            - '1.0'
          description: Fixed contract schema version literal
        requestId:
          type: string
          format: uuid
          description: Correlation UUID for the extraction request
        document:
          $ref: '#/components/schemas/DocumentInfo'
        text:
          $ref: '#/components/schemas/TextResult'
        confidence:
          type:
            - number
            - 'null'
          format: float
          minimum: 0.0
          maximum: 1.0
          description: >-
            Document-level confidence score (0.0 to 1.0).
            Computed as weighted average across non-whitespace Unicode code points of all text blocks.
            Nullable (null) when the document contains no detected text.
        blocks:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/TextBlock'
          description: Ordered sequence of extracted text blocks
        tables:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TableResult'
          description: Extracted table structures. Empty array if detectTables=false or no tables found.
        metadata:
          $ref: '#/components/schemas/ExtractionMetadata'
      additionalProperties: false

    DocumentInfo:
      type: object
      required:
        - fileName
        - mimeType
        - pages
        - pageInfo
      properties:
        fileName:
          type: string
          maxLength: 255
          description: Sanitized basename of the processed document
        mimeType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - application/pdf
          description: Canonical verified MIME type of the document
        pages:
          type: integer
          minimum: 1
          maximum: 10
          description: Total page count processed (1-10)
        pageInfo:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PageInfo'
          description: Dimensions and rendering metadata per page
      additionalProperties: false

    PageInfo:
      type: object
      required:
        - page
        - width
        - height
        - dpi
      properties:
        page:
          type: integer
          minimum: 1
          description: 1-based page number
        width:
          type: integer
          minimum: 1
          maximum: 10000
          description: Page width in canonical pixels
        height:
          type: integer
          minimum: 1
          maximum: 10000
          description: Page height in canonical pixels
        dpi:
          type:
            - integer
            - 'null'
          description: Render DPI for PDF pages (e.g. 200). Null for raster image formats.
      additionalProperties: false

    TextResult:
      type: object
      required:
        - rawText
      properties:
        rawText:
          type: string
          maxLength: 1048576
          description: >-
            Complete extracted text in Unicode NFC normalization.
            Lines separated by \n, multi-page breaks indicated by \n\f\n.
      additionalProperties: false

    BoundingBox:
      type: object
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
          minimum: 0.0
          description: X coordinate of upper-left corner in canonical page pixels
        y:
          type: number
          minimum: 0.0
          description: Y coordinate of upper-left corner in canonical page pixels
        width:
          type: number
          exclusiveMinimum: 0.0
          description: Box width in canonical page pixels
        height:
          type: number
          exclusiveMinimum: 0.0
          description: Box height in canonical page pixels
      additionalProperties: false

    TextBlock:
      type: object
      required:
        - id
        - order
        - text
        - confidence
        - page
        - boundingBox
      properties:
        id:
          type: string
          description: Unique block identifier within the extraction result (e.g. p1-b1)
        order:
          type: integer
          minimum: 0
          description: 0-based document reading order index
        text:
          type: string
          description: Extracted text content for this block in Unicode NFC
        confidence:
          type:
            - number
            - 'null'
          format: float
          minimum: 0.0
          maximum: 1.0
          description: OCR recognition confidence score between 0.0 and 1.0
        page:
          type: integer
          minimum: 1
          description: 1-based page number where block is located
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        polygon:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          description: Optional 4-point polygon coordinates [[x,y], ...]
      additionalProperties: false

    TableResult:
      type: object
      required:
        - id
        - page
        - boundingBox
        - rowCount
        - columnCount
        - confidence
        - cells
      properties:
        id:
          type: string
          description: Unique table identifier (e.g. p1-t1)
        page:
          type: integer
          minimum: 1
          description: 1-based page number containing the table
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        rowCount:
          type: integer
          minimum: 1
          description: Total number of rows in the table grid
        columnCount:
          type: integer
          minimum: 1
          description: Total number of columns in the table grid
        confidence:
          type:
            - number
            - 'null'
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Structural confidence score if provided by engine, or null
        cells:
          type: array
          items:
            $ref: '#/components/schemas/TableCell'
          description: Array of cells comprising the table
      additionalProperties: false

    TableCell:
      type: object
      required:
        - row
        - column
        - rowSpan
        - columnSpan
        - text
        - confidence
        - sourceBlockIds
      properties:
        row:
          type: integer
          minimum: 0
          description: 0-based row index
        column:
          type: integer
          minimum: 0
          description: 0-based column index
        rowSpan:
          type: integer
          minimum: 1
          default: 1
          description: Number of rows spanned by this cell
        columnSpan:
          type: integer
          minimum: 1
          default: 1
          description: Number of columns spanned by this cell
        text:
          type: string
          description: Extracted text inside the cell in Unicode NFC
        confidence:
          type:
            - number
            - 'null'
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Text recognition confidence score for cell content, or null
        boundingBox:
          oneOf:
            - $ref: '#/components/schemas/BoundingBox'
            - type: 'null'
          description: Cell bounding box in canonical page pixels if available, or null
        sourceBlockIds:
          type: array
          items:
            type: string
          description: IDs of TextBlocks merged into this cell
      additionalProperties: false

    ExtractionMetadata:
      type: object
      required:
        - language
        - resolvedLanguage
        - processingTimeMs
        - engine
        - engineVersion
        - modelRevision
        - tableDetection
        - quality
        - preprocessing
        - warnings
      properties:
        language:
          $ref: '#/components/schemas/LanguageOption'
        resolvedLanguage:
          type: string
          description: Resolved engine model identifier (e.g. latin-multilingual, en, vi)
        processingTimeMs:
          type: integer
          minimum: 0
          description: Total service wall-clock time spent processing the request in milliseconds
        engine:
          type: string
          description: OCR engine identifier (e.g. paddleocr)
        engineVersion:
          type: string
          description: Version of OCR library / engine
        modelRevision:
          type: string
          description: Identifier or hash of the model manifest
        tableDetection:
          type: string
          enum:
            - not_requested
            - completed
          description: Status of table detection pipeline for this extraction
        quality:
          type: string
          enum:
            - OK
            - LOW_CONFIDENCE
            - EMPTY
          description: >-
            High-level quality classification.
            EMPTY if no text found; LOW_CONFIDENCE if document confidence < 0.70; OK otherwise.
        preprocessing:
          type: array
          items:
            $ref: '#/components/schemas/PreprocessingRecord'
          description: Preprocessing steps applied per page
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionWarning'
          description: Non-fatal warnings encountered during extraction
      additionalProperties: false

    PreprocessingRecord:
      type: object
      required:
        - page
        - steps
      properties:
        page:
          type: integer
          minimum: 1
        steps:
          type: array
          items:
            type: string
          description: Names of preprocessing operations applied (e.g. grayscale, contrast, deskew)
      additionalProperties: false

    ExtractionWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Warning code (e.g. LOW_CONFIDENCE, BLANK_PAGE, ROTATION_CORRECTED)
        message:
          type: string
          description: Human-readable warning description
        page:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Page number associated with warning, if page-specific
        blockId:
          type:
            - string
            - 'null'
          description: Block ID associated with warning, if block-specific
      additionalProperties: false

    ApiErrorEnvelope:
      type: object
      required:
        - error
        - requestId
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorDetail'
        requestId:
          type: string
          format: uuid
          description: Correlation UUID for tracing and support
      additionalProperties: false

    ApiErrorDetail:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Safe human-readable error description. Free of sensitive credentials or internal paths.
        retryable:
          type: boolean
          description: Whether the client may retry the operation with backoff
        details:
          type: object
          additionalProperties: true
          description: Additional structured metadata regarding the error condition
      additionalProperties: false

    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - ARTIFACT_NOT_FOUND
        - FILE_TOO_LARGE
        - DOCUMENT_LIMIT_EXCEEDED
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_OPTIONS
        - CORRUPT_FILE
        - ENCRYPTED_PDF
        - ANIMATED_IMAGE_UNSUPPORTED
        - SOURCE_URL_NOT_ALLOWED
        - SOURCE_UNAVAILABLE
        - OUTPUT_LIMIT_EXCEEDED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SOURCE_FETCH_FAILED
        - TABLE_EXTRACTION_FAILED
        - OCR_BUSY
        - MODEL_NOT_READY
        - SOURCE_TIMEOUT
        - OCR_TIMEOUT
        - REQUEST_TIMEOUT
        - UPLOAD_TIMEOUT
