openapi: 3.1.0
info:
  title: Weav Identity Authentication API
  version: 1.1.0
  description: >-
    Identity-local JSON contract for registration, login, opaque refresh-token
    rotation, logout, current-user profile, self-service session management,
    and password change. Gateway and browser transport are outside this
    milestone.
servers:
  - url: http://localhost:8081
    description: Local Identity service
tags:
  - name: Authentication
  - name: Users
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register an email/password user
      description: >-
        Creates an ACTIVE user with the USER system role. Registration does not
        establish a session and does not return tokens. Email ownership remains
        unverified in this milestone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered; no login session was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated session
      description: >-
        Returns the same generic 401 response for an unknown user, wrong
        password, OAuth-only account, disabled account, or other invalid
        credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token
      description: >-
        Atomically replaces a valid single-use opaque refresh token and returns
        a new token pair. The old token is invalid after a successful commit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh token rotated and replacement token pair issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a refresh-token session
      description: >-
        Revokes the session identified by a well-formed refresh token. The
        operation is idempotent for unknown, expired, or already-revoked
        well-formed tokens and does not require a live access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logout completed; the response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated user's local password
      description: >-
        Requires a valid access JWT and an ACTIVE user with a matching active
        session. Verifies the current local password, updates it, and revokes
        every session for the user, including the session authorizing this
        request, in one transaction. Wrong current credentials and accounts
        without a local password return the same generic 401 response.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: >-
            Password changed and all existing sessions revoked; the response
            has no body and the client must log in again.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: >-
        Requires a valid access JWT and an ACTIVE user with a matching active
        session. The user identifier is taken from verified JWT claims, never
        from client input.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current public user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      description: >-
        Updates only displayName for the ACTIVE user associated with the
        matching active session. The displayName member must be present; null
        or a blank string clears it, while a non-blank string is trimmed. Email,
        role, status, avatar storage keys, identifiers, and timestamps are not
        accepted input fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated public user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/sessions:
    get:
      tags: [Users]
      operationId: listCurrentUserSessions
      summary: List the authenticated user's active sessions
      description: >-
        Returns only active sessions owned by the current user, ordered by
        createdAt descending and then id for stable pagination. Token material,
        token hashes, and raw IP addresses are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of sessions per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of active sessions owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      operationId: revokeAllCurrentUserSessions
      summary: Revoke all sessions owned by the authenticated user
      description: >-
        Revokes every existing session for the current user, including the
        session authorizing this request. A genuinely new login that completes
        after this operation may create a new session; revoked sessions are not
        restored.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All existing sessions were revoked; the response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/sessions/{sessionId}:
    delete:
      tags: [Users]
      operationId: revokeCurrentUserSession
      summary: Revoke one session owned by the authenticated user
      description: >-
        Revokes the identified owned session, including the current session.
        Repeating the request for an already-revoked session owned by this user
        remains successful. A missing session or a session owned by another
        user returns the same 404 response.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session UUID selected for revocation.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Owned session revoked or already revoked; the response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 access JWT issued by Identity. Refresh tokens are opaque values
        supplied only in JSON request bodies and are never bearer credentials.

  headers:
    CacheControlNoStore:
      description: Prevents token-bearing responses from being cached.
      schema:
        type: string
        const: no-store
      example: no-store
    RetryAfter:
      description: Number of seconds until the caller should retry.
      schema:
        type: integer
        minimum: 1
      example: 60
    BearerChallenge:
      description: Bearer authentication challenge.
      schema:
        type: string
      example: Bearer

  responses:
    BadRequest:
      description: Request validation failed or the JSON body was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: email
                      message: Email must be valid
                timestamp: '2026-09-05T08:30:00Z'
                status: 400
                path: /auth/register
            invalidProfile:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: displayName
                      message: Display name must be at most 120 characters
                timestamp: '2026-09-06T08:30:00Z'
                status: 400
                path: /users/me
            invalidPassword:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - field: newPassword
                      message: Password must be at most 72 bytes when encoded as UTF-8
                timestamp: '2026-09-06T08:30:00Z'
                status: 400
                path: /auth/change-password
    Unauthorized:
      description: Credentials, token, account, or session are invalid.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/BearerChallenge'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Authentication failed
                  details: []
                timestamp: '2026-09-05T08:30:00Z'
                status: 401
                path: /auth/login
            invalidCurrentSession:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Authentication failed
                  details: []
                timestamp: '2026-09-06T08:30:00Z'
                status: 401
                path: /users/me/sessions
            invalidCurrentPassword:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Authentication failed
                  details: []
                timestamp: '2026-09-06T08:30:00Z'
                status: 401
                path: /auth/change-password
    NotFound:
      description: The target does not exist or is not owned by the current user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            sessionNotFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Resource not found
                  details: []
                timestamp: '2026-09-06T08:30:00Z'
                status: 404
                path: /users/me/sessions/92d13ef9-3e27-4e2e-b788-7f1f5da5a5f7
    Conflict:
      description: The canonical email is already registered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            duplicateEmail:
              value:
                error:
                  code: CONFLICT
                  message: Resource state conflicts with existing data
                  details: []
                timestamp: '2026-09-05T08:30:00Z'
                status: 409
                path: /auth/register
    TooManyRequests:
      description: The applicable authentication rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many requests
                  details: []
                timestamp: '2026-09-05T08:30:00Z'
                status: 429
                path: /auth/login
    InternalError:
      description: Sanitized unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            internalError:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred
                  details: []
                timestamp: '2026-09-05T08:30:00Z'
                status: 500
                path: /auth/login

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Optional display name. A JSON null is preserved as absent.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: >-
            Unpadded base64url encoding of 32 cryptographically random bytes.
            Send only in this JSON field, never in a URL or log.

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          $ref: '#/components/schemas/Password'
        newPassword:
          $ref: '#/components/schemas/Password'

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: [string, 'null']
          maxLength: 120
          description: >-
            Required member. Null or a string containing only whitespace clears
            the display name. Other strings are trimmed before storage.

    Email:
      type: string
      minLength: 3
      maxLength: 320
      pattern: "^ *[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+ *$"
      description: >-
        ASCII email identifier. Identity removes only boundary U+0020 SPACE
        characters and applies Locale.ROOT ASCII case folding for lookup and
        uniqueness. Other whitespace is rejected; no dot or plus rewriting is
        performed.

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      writeOnly: true
      description: >-
        Passwords are neither trimmed nor normalized and must also be no more
        than 72 bytes when encoded as UTF-8 for BCrypt.

    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresAt
        - user
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: HS256 access JWT.
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Replacement opaque single-use refresh token.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          description: Access-token lifetime in seconds from issuance.
        refreshExpiresAt:
          type: string
          format: date-time
          description: Absolute refresh-session expiry as a UTC RFC 3339 timestamp.
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - avatarStorageKey
        - systemRole
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 320
          description: Stored supported email spelling; never a password or token field.
        displayName:
          type: [string, 'null']
          maxLength: 120
        avatarStorageKey:
          type: [string, 'null']
          maxLength: 512
        systemRole:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
          description: UTC RFC 3339 timestamp.
        updatedAt:
          type: string
          format: date-time
          description: UTC RFC 3339 timestamp.

    SessionPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'
        page:
          type: integer
          minimum: 0
          description: Zero-based page index returned by the server.
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - createdAt
        - lastUsedAt
        - expiresAt
        - current
        - userAgent
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: UTC RFC 3339 timestamp.
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: UTC RFC 3339 timestamp, or null when never refreshed.
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry as a UTC RFC 3339 timestamp.
        current:
          type: boolean
          description: True when this session matches the access JWT sid claim.
        userAgent:
          type: [string, 'null']
          maxLength: 512
          description: Bounded client metadata; null for legacy sessions.

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error, timestamp, status, path]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        timestamp:
          type: string
          format: date-time
          description: UTC RFC 3339 timestamp.
        status:
          type: integer
          minimum: 400
          maximum: 599
        path:
          type: string
          maxLength: 2048

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 512
        details:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          maxLength: 256
        message:
          type: string
          maxLength: 512
